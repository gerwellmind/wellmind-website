<!DOCTYPE html>
<html lang="en-IE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c1a17">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Well Mind with Ger Boland — Everyday Wellbeing and Understanding Yourself, your journal in one place.">
<title>Well Mind · Your journal</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/favicon-64.png" type="image/png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0c1a17;--night2:#10251f;--deep:#163a31;--moss:#284e43;--gold:#ecc97f;--gold2:#f7e2ad;--cream:#f6f0e3;--ink:#f2eee6;--muted:#a9bdb4;--line:rgba(236,201,127,.18);
  --card:rgba(18,44,37,.72);--card2:rgba(26,58,49,.85);--paper:#fbf7ee;--paper-ink:#1d2b26;--rose:#f2a7b4;--teal:#7fd8c6;
  --r:22px;--shadow:0 20px 60px rgba(0,0,0,.35);
  --display:'Fraunces',Georgia,'Times New Roman',serif;--body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--night);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overflow-x:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--gold)}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- sky ---------- */
#sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:radial-gradient(1200px 700px at 80% -10%,#1d4a3f 0%,transparent 60%),radial-gradient(900px 600px at -10% 110%,#2a2350 0%,transparent 55%),linear-gradient(180deg,#0b1714 0%,#0e211c 50%,#0b1714 100%)}
.aurora{position:absolute;width:70vmax;height:70vmax;border-radius:50%;filter:blur(80px);opacity:.28;mix-blend-mode:screen;animation:drift 28s ease-in-out infinite alternate}
.aurora.a1{background:radial-gradient(circle,#3fbf9f 0%,transparent 60%);top:-30vmax;left:-10vmax}
.aurora.a2{background:radial-gradient(circle,#8a6bff 0%,transparent 60%);bottom:-35vmax;right:-20vmax;animation-duration:36s;opacity:.2}
.aurora.a3{background:radial-gradient(circle,#ecc97f 0%,transparent 60%);top:30vh;left:40vw;width:40vmax;height:40vmax;opacity:.1;animation-duration:44s}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
.star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.6;animation:twinkle 4s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.12}}

/* ---------- layout ---------- */
#app{position:relative;z-index:1;min-height:100vh;padding-bottom:calc(96px + var(--safe-b))}
.wrap{max-width:760px;margin:0 auto;padding:calc(18px + var(--safe-t)) 18px 24px}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.brand .mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#2c5b4e,#163a31);display:grid;place-items:center;font-family:var(--display);color:var(--gold);font-size:18px;box-shadow:inset 0 0 0 1px var(--line)}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:rgba(236,201,127,.1);box-shadow:inset 0 0 0 1px var(--line);font-size:13px;color:var(--gold2);white-space:nowrap}
.pill b{font-weight:700}
.iconbtn{width:42px;height:42px;border-radius:14px;border:0;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);display:grid;place-items:center;font-size:18px;color:var(--ink)}
.iconbtn:hover{background:rgba(255,255,255,.1)}
h1,h2,h3{font-family:var(--display);font-weight:500;line-height:1.12;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(34px,7vw,52px)}
h2{font-size:clamp(24px,4.6vw,32px)}
h3{font-size:20px}
.eyebrow{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
p{margin:.5em 0}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;padding:14px 22px;font-weight:600;font-size:15px;background:linear-gradient(135deg,#f5d995,#e3b866);color:#1e2a24;box-shadow:0 10px 30px rgba(236,201,127,.25),inset 0 1px 0 rgba(255,255,255,.6);text-decoration:none;transition:transform .15s ease,box-shadow .2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 14px 34px rgba(236,201,127,.32)}
.btn:active{transform:translateY(1px) scale(.99)}
.btn.ghost{background:rgba(255,255,255,.06);color:var(--ink);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.btn.small{padding:9px 14px;font-size:13px;border-radius:12px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.linkbtn{background:none;border:0;color:var(--gold);padding:0;font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* ---------- glass cards ---------- */
.glass{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:var(--r);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07),var(--shadow);padding:20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.section-h{display:flex;align-items:baseline;gap:10px;margin:30px 2px 12px}
.section-h h2{font-size:24px}

/* ---------- home ---------- */
.hello{margin:6px 2px 18px}
.hello h1 em{font-style:italic;color:var(--gold2)}
.levelbar{display:flex;align-items:center;gap:14px;margin-top:14px}
.levelbar .track{flex:1;height:8px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden}
.levelbar .fill{height:100%;background:linear-gradient(90deg,#7fd8c6,#ecc97f);border-radius:9px;box-shadow:0 0 18px rgba(236,201,127,.6);transition:width 1s cubic-bezier(.2,.8,.2,1)}
.quest{display:flex;gap:16px;align-items:center;text-decoration:none;color:inherit;padding:18px;border-radius:var(--r);background:linear-gradient(135deg,rgba(236,201,127,.16),rgba(127,216,198,.08));box-shadow:inset 0 0 0 1px var(--line);transition:transform .2s}
.quest:hover{transform:translateY(-2px)}
.quest .orb{flex:0 0 58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:radial-gradient(circle at 35% 30%,#fff3cf,#ecc97f 45%,#a77d2e);box-shadow:0 0 30px rgba(236,201,127,.55);color:#2a2414;animation:pulse 3.2s ease-in-out infinite}
.quest.done .orb{background:radial-gradient(circle at 35% 30%,#e9fff9,#7fd8c6 50%,#2c8a75);box-shadow:0 0 26px rgba(127,216,198,.5);animation:none}
@keyframes pulse{50%{box-shadow:0 0 46px rgba(236,201,127,.85)}}
.quest h3{font-size:19px}
.quest p{margin:2px 0 0;color:var(--muted);font-size:14px}
.chips-row{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.chips-row::-webkit-scrollbar{display:none}
.mini{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:16px;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);text-decoration:none;color:var(--ink);font-size:14px;font-weight:600}
.mini span{font-size:18px}
.moons{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.moons i{width:11px;height:11px;border-radius:50%;background:rgba(255,255,255,.1)}
.moons i.on{background:var(--gold);box-shadow:0 0 10px rgba(236,201,127,.8)}
.moons i.today{outline:1px solid var(--gold);outline-offset:2px}

/* ---------- the map ---------- */
.map{position:relative;margin:6px auto 0;max-width:560px}
.map svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.map .path-dim{fill:none;stroke:rgba(236,201,127,.22);stroke-width:2;stroke-dasharray:2 9;stroke-linecap:round}
.map .path-lit{fill:none;stroke:url(#litgrad);stroke-width:3;stroke-linecap:round;filter:drop-shadow(0 0 6px rgba(236,201,127,.8))}
.node{text-decoration:none;color:inherit;position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;padding:0;width:150px;text-align:center}
.node .star-btn{position:relative;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:24px;color:var(--c);background:radial-gradient(circle at 40% 35%,rgba(255,255,255,.14),rgba(255,255,255,.02) 70%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);transition:transform .25s cubic-bezier(.2,.9,.3,1.4)}
.node:hover .star-btn{transform:scale(1.08)}
.node .ring{position:absolute;inset:-5px;width:74px;height:74px;transform:rotate(-90deg)}
.node .ring circle{fill:none;stroke-width:3;stroke-linecap:round}
.node .ring .bg{stroke:rgba(255,255,255,.08)}
.node .ring .fg{stroke:var(--c);filter:drop-shadow(0 0 4px var(--c));transition:stroke-dashoffset 1s}
.node.lit .star-btn{background:radial-gradient(circle at 40% 35%,#fffbe9,var(--c) 55%,rgba(0,0,0,.2));color:#1b2a24;box-shadow:0 0 34px var(--c),0 0 80px color-mix(in srgb,var(--c) 40%,transparent);animation:glow 3.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 50px var(--c),0 0 110px color-mix(in srgb,var(--c) 55%,transparent)}}
.node .num{font-size:10px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}
.node .ttl{font-family:var(--display);font-size:16px;line-height:1.15;color:var(--ink)}
.node.lit .ttl{color:var(--gold2)}

/* ---------- chapter player ---------- */
.player{min-height:100vh;display:flex;flex-direction:column}
.player-top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:calc(12px + var(--safe-t)) 16px 10px;background:linear-gradient(180deg,rgba(12,26,23,.95),rgba(12,26,23,.6) 70%,transparent)}
.player-top .t{flex:1;min-width:0}
.player-top .t div{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--c,var(--gold))}
.player-top .t strong{display:block;font-family:var(--display);font-weight:500;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:4px;padding:0 16px 6px;max-width:760px;margin:0 auto;width:100%}
.dots i{flex:1;height:4px;border-radius:4px;background:rgba(255,255,255,.1);transition:background .3s}
.dots i.on{background:var(--c,var(--gold));box-shadow:0 0 8px var(--c,var(--gold))}
.dots i.cur{background:#fff}
.deck{flex:1;max-width:760px;width:100%;margin:0 auto;padding:12px 16px 120px}
.cardx{background:var(--paper);color:var(--paper-ink);border-radius:28px;padding:28px 24px;box-shadow:0 30px 80px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.4) inset;position:relative;overflow:hidden;animation:cardIn .45s cubic-bezier(.2,.9,.25,1)}
.cardx.back{animation-name:cardBack}
@keyframes cardIn{from{opacity:0;transform:translateX(40px) rotate(1.5deg) scale(.98)}}
@keyframes cardBack{from{opacity:0;transform:translateX(-40px) rotate(-1.5deg) scale(.98)}}
.cardx::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 40%,#ecc97f))}
.cardx .eyebrow{color:color-mix(in srgb,var(--c) 55%,#3b4a43)}
.cardx h2{color:#17251f;margin:6px 0 10px}
.cardx p,.cardx li{color:#33433c}
.cardx .lead{font-size:17px}
.cardx a{color:#2f6b5b}
.consider{margin:16px 0 4px;padding:16px 18px;border-radius:18px;background:color-mix(in srgb,var(--c) 18%,#fff);font-family:var(--display);font-size:20px;line-height:1.3;color:#1d2b26}
.consider small{display:block;font-family:var(--body);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#56665e;margin-bottom:4px}
.intro-hero{display:flex;align-items:center;gap:18px;margin-bottom:6px}
.intro-hero .big{flex:0 0 76px;height:76px;border-radius:24px;display:grid;place-items:center;font-size:36px;color:#fff;background:radial-gradient(circle at 35% 30%,#fff7,transparent 60%),var(--c);box-shadow:0 14px 34px color-mix(in srgb,var(--c) 55%,transparent)}
.steps-list{list-style:none;padding:0;margin:14px 0;display:grid;gap:8px}
.steps-list li{display:flex;gap:12px;padding:12px 14px;border-radius:14px;background:#f2ece0}
.steps-list b{display:block;color:#1d2b26}
.steps-list .n{flex:0 0 28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--c);color:#14221d}
.field{margin:18px 0 0}
.field label{display:block;font-weight:600;color:#1d2b26;margin-bottom:4px;font-size:15.5px;line-height:1.35}
.field .hint{display:block;font-size:13px;color:#6b7a73;margin:-2px 0 8px}
.field textarea,.field input[type=text],.field input[type=date]{width:100%;border:0;border-radius:16px;padding:14px 16px;background:#f1ebdd;color:#1d2b26;box-shadow:inset 0 0 0 1px rgba(29,43,38,.08);resize:none;min-height:56px;line-height:1.5;transition:box-shadow .2s,background .2s}
.field textarea:focus,.field input:focus{outline:none;background:#fff;box-shadow:inset 0 0 0 2px var(--c),0 0 0 6px color-mix(in srgb,var(--c) 18%,transparent)}
.field.answered label::after{content:" ✦";color:color-mix(in srgb,var(--c) 70%,#b58a2e)}
.field input[type=range]{width:100%;accent-color:var(--c)}
.scaleval{font-family:var(--display);font-size:28px;color:#1d2b26}
.note{margin-top:18px;padding:12px 14px;border-radius:14px;background:#efe8da;font-size:13.5px;color:#4a5953;line-height:1.5}
.note::before{content:"ⓘ ";color:#6c7b74}
.callout{margin:16px 0;padding:16px 18px;border-radius:18px;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 22%,#fff),#fff);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 40%,transparent)}
.callout b{display:block;font-family:var(--display);font-weight:600;font-size:17px;color:#1d2b26;margin-bottom:4px}
.example{margin:16px 0;padding:14px 16px;border-left:4px solid var(--c);background:#f4efe4;border-radius:0 14px 14px 0;font-size:14.5px}
.example::before{content:"Fictional example";display:block;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#6b7a73;margin-bottom:4px}
.tbl{width:100%;border-collapse:separate;border-spacing:0 6px;margin:12px 0;font-size:14px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#6b7a73;font-weight:600;padding:0 10px}
.tbl td{background:#f2ece0;padding:10px;vertical-align:top;color:#33433c}
.tbl td:first-child{border-radius:12px 0 0 12px;font-weight:600;color:#1d2b26}
.tbl td:last-child{border-radius:0 12px 12px 0}
.quotes{display:grid;gap:10px;margin:14px 0}
.quotes div{padding:14px 16px;border-radius:16px;background:#f2ece0}
.quotes b{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#6b7a73;margin-bottom:4px}
.quotes q{font-family:var(--display);font-size:17px;color:#1d2b26;quotes:none}
.paths{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.paths div{padding:14px;border-radius:16px;background:#f2ece0;font-size:14px}
.paths b{display:block;font-family:var(--display);font-size:17px;color:#1d2b26;margin-bottom:4px}
.resource{margin-top:16px;padding:14px 16px;border-radius:16px;border:1px dashed color-mix(in srgb,var(--c) 70%,#999);font-size:14px}
.resource b{display:block;color:#1d2b26}
.resource code{font-family:var(--body);font-size:13px;color:#2f6b5b;word-break:break-all}
.reflection-tag{display:inline-block;margin-left:6px;padding:3px 9px;border-radius:999px;background:var(--c);color:#14221d;font-size:10px;letter-spacing:.14em;vertical-align:middle}
.leader-card{background:radial-gradient(circle at 80% 0%,color-mix(in srgb,var(--c) 45%,#fff) 0%,transparent 55%),linear-gradient(160deg,#1a3a31,#0f241f);color:var(--ink)}
.leader-card h2{color:var(--gold2)}
.leader-card .crown{font-size:44px;line-height:1;margin-bottom:8px;filter:drop-shadow(0 0 16px rgba(236,201,127,.7))}
.leader-card p{color:#d8e4de}
.leader-card .field label{color:var(--ink)}
.leader-card .field textarea{background:rgba(255,255,255,.08);color:var(--ink);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.leader-card .field textarea:focus{background:rgba(255,255,255,.12)}
.grow{display:grid;gap:10px;margin-top:10px}
.grow .row{display:grid;grid-template-columns:54px 1fr;gap:12px;align-items:start}
.grow .letter{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-family:var(--display);font-size:26px;color:#14221d;background:var(--c);box-shadow:0 8px 20px color-mix(in srgb,var(--c) 45%,transparent)}
.grow .letter small{display:block;font-family:var(--body);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;margin-top:-6px}
.grow .field{margin:0}
.letter-paper{background:repeating-linear-gradient(180deg,#fbf7ee 0,#fbf7ee 33px,#e9e1cf 34px);}
.letter-paper .field textarea{background:transparent;box-shadow:none;font-family:var(--display);font-size:18px;line-height:34px;padding:0 4px;border-bottom:1px solid transparent}

.navbar{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;padding:10px 12px calc(10px + var(--safe-b));background:linear-gradient(0deg,rgba(10,22,19,.98) 50%,rgba(10,22,19,0))}
.navbar nav{display:flex;gap:6px;padding:6px;border-radius:24px;background:rgba(22,48,41,.92);backdrop-filter:blur(14px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 12px 40px rgba(0,0,0,.5)}
.navbar a{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:68px;padding:8px 10px;border-radius:18px;color:var(--muted);text-decoration:none;font-size:11px;font-weight:600}
.navbar a span{font-size:20px;line-height:1}
.navbar a.on{background:rgba(236,201,127,.14);color:var(--gold2)}
.playnav{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:12px 16px calc(12px + var(--safe-b));background:linear-gradient(0deg,rgba(10,22,19,.98) 55%,rgba(10,22,19,0))}
.playnav .in{max-width:760px;margin:0 auto;display:flex;gap:10px}
.playnav .btn.ghost{flex:0 0 auto}
.playnav .btn:last-child{flex:1}

/* ---------- games ---------- */
.vchips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.vchip{border:0;border-radius:999px;padding:9px 14px;background:#efe8d9;color:#2c3c35;font-size:14px;font-weight:500;transition:transform .15s,background .2s,box-shadow .2s}
.vchip:hover{transform:translateY(-1px)}
.vchip.on{background:var(--c);color:#13211c;font-weight:700;box-shadow:0 6px 16px color-mix(in srgb,var(--c) 50%,transparent)}
.vchip.dim{opacity:.45}
.vsearch{width:100%;border:0;border-radius:14px;padding:12px 14px;background:#f1ebdd;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.round-head{display:flex;align-items:center;gap:10px;margin-top:6px;flex-wrap:wrap}
.counter{font-family:var(--display);font-size:26px;color:#1d2b26}
.crystals{display:flex;justify-content:center;gap:14px;margin:18px 0 6px;flex-wrap:wrap}
.crystal{width:104px;height:120px;display:grid;place-items:center;text-align:center;padding:10px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:linear-gradient(160deg,#fff 0%,var(--c) 60%,color-mix(in srgb,var(--c) 60%,#1d2b26));color:#13211c;font-weight:700;font-size:14px;animation:pop .6s cubic-bezier(.2,1.4,.3,1) both}
.crystal:nth-child(2){animation-delay:.12s}.crystal:nth-child(3){animation-delay:.24s}
@keyframes pop{from{transform:scale(.3) rotate(-20deg);opacity:0}}
.steps3{display:flex;gap:6px;margin:8px 0}
.steps3 i{flex:1;height:6px;border-radius:6px;background:#e6dece}
.steps3 i.on{background:var(--c)}

.johari{display:grid;grid-template-columns:auto 1fr 1fr;gap:8px;margin:14px 0;font-size:13.5px}
.johari .ax{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#6b7a73;display:flex;align-items:center;justify-content:center;text-align:center;padding:4px}
.johari .ax.v{writing-mode:vertical-rl;transform:rotate(180deg)}
.jq{border:0;text-align:left;border-radius:18px;padding:14px;min-height:118px;background:#f2ece0;color:#33433c;transition:transform .2s,background .2s,box-shadow .2s}
.jq b{display:block;font-family:var(--display);font-size:19px;color:#1d2b26;margin-bottom:4px}
.jq.on{background:var(--c);transform:scale(1.02);box-shadow:0 12px 26px color-mix(in srgb,var(--c) 45%,transparent)}
.jq.on,.jq.on b{color:#13211c}

.zones{display:grid;gap:12px;margin-top:12px}
.zone{border-radius:20px;padding:16px;background:#f2ece0;position:relative;overflow:hidden}
.zone::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--z)}
.zone h3{font-size:18px;color:#1d2b26;display:flex;align-items:center;gap:8px}
.zone h3 span{font-family:var(--body);font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--z);color:#13211c}
.zone .field{margin-top:10px}
.meter{position:relative;margin:18px 0 6px}
.meter input{width:100%;-webkit-appearance:none;appearance:none;height:16px;border-radius:999px;background:linear-gradient(90deg,#8fe3a8 0%,#8fe3a8 25%,#ffd27a 45%,#ffb36b 62%,#ff8a7a 80%,#f26a7a 100%);outline:none}
.meter input::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;border-radius:50%;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.3),0 0 0 6px rgba(255,255,255,.35);cursor:pointer}
.meter input::-moz-range-thumb{width:34px;height:34px;border-radius:50%;background:#fff;border:0;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.meter-read{display:flex;align-items:baseline;gap:12px;margin-top:10px}
.meter-read .num{font-family:var(--display);font-size:56px;line-height:1}

.ptoggles{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}
.ptoggles h3{font-size:16px;color:#1d2b26;margin-bottom:6px}
.tog{display:flex;align-items:center;gap:10px;width:100%;border:0;text-align:left;padding:10px 12px;margin-bottom:6px;border-radius:14px;background:#f2ece0;color:#33433c;font-size:14px;transition:background .2s}
.tog i{flex:0 0 20px;height:20px;border-radius:7px;box-shadow:inset 0 0 0 2px #b9b0a0;display:grid;place-items:center;font-style:normal;font-size:12px}
.tog.on{background:color-mix(in srgb,var(--c) 30%,#fff);color:#13211c}
.tog.on i{background:var(--c);box-shadow:none}
.tog.on i::after{content:"✓";font-weight:800}

.sentence{margin:18px 0;padding:22px;border-radius:22px;background:linear-gradient(150deg,#163a31,#0f241f);color:var(--ink);font-family:var(--display);font-size:21px;line-height:1.45;box-shadow:0 18px 40px rgba(0,0,0,.25)}
.sentence .blank{color:var(--gold2);border-bottom:2px dotted rgba(236,201,127,.6)}
.sentence .empty{color:rgba(255,255,255,.35)}

.pause{display:grid;place-items:center;margin:20px 0 6px;text-align:center}
.pause svg{width:220px;height:220px}
.pause .ring-bg{fill:none;stroke:#ece4d3;stroke-width:12}
.pause .ring-fg{fill:none;stroke:var(--c);stroke-width:12;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset 1s linear}
.pause .stage{font-family:var(--display);font-size:22px;color:#1d2b26;min-height:60px;max-width:420px;margin:8px auto}
.pause .time{font-family:var(--display);font-size:42px;fill:#1d2b26}
.breathe{animation:breathe 8s ease-in-out infinite;transform-origin:50% 50%}
@keyframes breathe{50%{transform:scale(1.06)}}

.rumi{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.rumi h3{font-size:15px;color:#1d2b26;margin-bottom:6px}
.verdict{margin-top:14px;padding:14px 16px;border-radius:16px;font-weight:600;color:#13211c;background:color-mix(in srgb,var(--c) 35%,#fff);animation:pop .4s ease both}

.shapes{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.swatch{width:40px;height:40px;border-radius:50%;border:0;box-shadow:inset 0 0 0 3px rgba(255,255,255,.6),0 2px 6px rgba(0,0,0,.15);transition:transform .15s}
.swatch.on{transform:scale(1.18);box-shadow:0 0 0 3px #1d2b26}
.shapebtn{width:48px;height:48px;border-radius:14px;border:0;background:#f2ece0;display:grid;place-items:center}
.shapebtn.on{background:var(--c)}
.canvas-art{display:grid;place-items:center;margin:14px 0;height:220px;border-radius:22px;background:radial-gradient(circle at 50% 40%,#fff,#f1eadb);overflow:hidden}
.canvas-art svg{width:200px;height:200px;animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px) rotate(4deg)}}

.wheelwrap{display:grid;place-items:center;margin:12px 0;overflow:hidden}
.wheelwrap svg{width:100%;max-width:400px;height:auto;overflow:hidden}
.wheel-grid{fill:none;stroke:#e3dac7}
.wheel-poly{fill:color-mix(in srgb,var(--c) 45%,transparent);stroke:var(--c);stroke-width:2.5;transition:all .4s}
.wheel-old{fill:rgba(127,140,255,.12);stroke:#8d93ff;stroke-width:2;stroke-dasharray:5 4}
.wheel-label{font-size:12.5px;fill:#4a5953;font-weight:600}
.sliders{display:grid;gap:10px;margin-top:8px}
.srow{display:grid;grid-template-columns:1fr 34px;gap:8px;align-items:center}
.srow input[type=text]{border:0;background:transparent;font-weight:600;font-size:14px;color:#1d2b26;padding:2px 0;width:100%}
.srow input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--c)}
.srow .v{font-family:var(--display);font-size:20px;text-align:right;color:#1d2b26}
.snap-list{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.diff{width:100%;border-collapse:collapse;font-size:14px;margin:10px 0}
.diff td,.diff th{padding:8px 6px;border-bottom:1px solid #ebe3d3;text-align:left}
.diff .up{color:#2f7d5a;font-weight:700}.diff .down{color:#b0503e;font-weight:700}

.bp-row{margin-top:18px;padding-top:14px;border-top:1px solid #ebe3d3}
.sugs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 2px}
.sug{border:0;border-radius:999px;padding:6px 11px;background:color-mix(in srgb,var(--c) 22%,#fff);color:#1d2b26;font-size:12.5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sug::before{content:"✦ "}
.then{margin:8px 0 0;padding:10px 12px;border-radius:12px;background:#ece7ff;font-size:14px;color:#3a3a6a}
.then b{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#6a6aa0}

/* finish */
.finish{text-align:center;padding:36px 24px}
.finish .big{width:120px;height:120px;margin:4px auto 18px;border-radius:50%;display:grid;place-items:center;font-size:52px;background:radial-gradient(circle at 40% 35%,#fffbe9,var(--c) 55%,rgba(0,0,0,.2));color:#1b2a24;box-shadow:0 0 50px var(--c)}
.stat-row{display:flex;justify-content:center;gap:12px;margin:14px 0}
.stat{padding:12px 16px;border-radius:16px;background:#f2ece0;min-width:96px}
.stat b{display:block;font-family:var(--display);font-size:28px;color:#1d2b26}
.stat span{font-size:12px;color:#6b7a73}

/* celebration overlay */
.overlay{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;background:rgba(5,12,10,.72);backdrop-filter:blur(8px);animation:fade .3s ease}
@keyframes fade{from{opacity:0}}
.insight{width:min(340px,88vw);aspect-ratio:3/4.2;perspective:1200px;cursor:pointer}
.insight .inner{position:relative;width:100%;height:100%;transition:transform 1s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.insight.flip .inner{transform:rotateY(180deg)}
.insight .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px;text-align:center}
.insight .front{background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--c) 70%,#fff),#163a31 70%);box-shadow:0 0 0 2px var(--gold),0 0 80px var(--c);color:#fff}
.insight .front .g{font-size:84px;filter:drop-shadow(0 0 24px #fff)}
.insight .back{transform:rotateY(180deg);background:linear-gradient(160deg,#fbf7ee,#efe6d2);color:#1d2b26;box-shadow:0 0 0 2px var(--gold),0 30px 80px rgba(0,0,0,.5)}
.insight .back .g{font-size:34px;color:var(--c);filter:drop-shadow(0 0 8px var(--c))}
.insight .back q{font-family:var(--display);font-size:24px;line-height:1.3;quotes:none;margin:14px 0}
.overlay .actions{display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.overlay-inner{text-align:center}
.overlay h2{color:var(--gold2);margin-bottom:14px}
canvas#fx{position:fixed;inset:0;z-index:60;pointer-events:none}
.floater{position:fixed;z-index:70;pointer-events:none;font-weight:800;color:var(--gold);text-shadow:0 0 12px rgba(236,201,127,.9);animation:floatup 1.2s ease-out forwards}
@keyframes floatup{to{transform:translateY(-60px);opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(110px + var(--safe-b));transform:translateX(-50%);z-index:80;padding:12px 18px;border-radius:16px;background:#f7e2ad;color:#1d2b26;font-weight:600;box-shadow:var(--shadow);animation:fade .3s}

/* collection + me */
.collection{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.cc{aspect-ratio:3/4;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px;border:0;text-align:center;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);color:var(--muted);font-size:10px}
.cc .g{font-size:26px;opacity:.25}
.cc.got{background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--c) 55%,transparent),rgba(22,58,49,.9) 75%);box-shadow:0 0 0 1px var(--gold),0 0 22px color-mix(in srgb,var(--c) 40%,transparent);color:var(--gold2)}
.cc.got .g{opacity:1;filter:drop-shadow(0 0 10px #fff)}
.list{display:grid;gap:10px}
.item{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:18px;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07);color:var(--ink);text-decoration:none;border:0;width:100%;text-align:left}
.item .ic{flex:0 0 42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:20px;background:rgba(236,201,127,.12);color:var(--gold2)}
.item b{display:block}
.item small{color:var(--muted)}
.item .go{margin-left:auto;color:var(--muted)}
.find-row{padding:16px;border-radius:20px;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
.find-row h3{font-size:19px;margin-bottom:10px}
.find-row .two{display:flex;gap:8px;flex-wrap:wrap}
.input-dark{width:100%;border:0;border-radius:14px;padding:13px 15px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);color:var(--ink)}
.input-dark:focus{outline:none;box-shadow:inset 0 0 0 2px var(--gold)}
textarea.input-dark{min-height:120px;resize:vertical;font-size:13px;font-family:ui-monospace,Menlo,monospace}
.feel-chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.feel{border:0;padding:12px 16px;border-radius:18px;background:#efe8d9;color:#2c3c35;font-weight:600;display:flex;align-items:center;gap:8px;transition:transform .15s,background .2s}
.feel span{font-size:20px}
.feel.on{background:var(--c);color:#13211c;transform:scale(1.04)}
.past{display:grid;gap:8px;margin-top:12px}
.past details{border-radius:16px;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07);padding:12px 16px}
.past summary{cursor:pointer;font-weight:600;list-style:none}
.past summary::-webkit-details-marker{display:none}
.past p{color:var(--muted);font-size:14px}
.warn{padding:12px 14px;border-radius:14px;background:rgba(242,167,180,.15);box-shadow:inset 0 0 0 1px rgba(242,167,180,.4);font-size:14px;margin-bottom:14px}
.support-btn{border:0;border-radius:999px;padding:9px 14px;background:rgba(242,167,180,.16);color:#ffd5dc;font-weight:700;font-size:12.5px;box-shadow:inset 0 0 0 1px rgba(242,167,180,.45);backdrop-filter:blur(10px)}
.sheet{width:min(520px,100%);max-height:88vh;overflow:auto;border-radius:28px;background:#fbf7ee;color:#1d2b26;padding:26px;box-shadow:var(--shadow)}
.sheet h2{color:#1d2b26;margin-bottom:8px}
.sheet .line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #ebe3d3}
.sheet .line b{font-size:17px}
.sheet .line a{font-weight:700;color:#2f6b5b;white-space:nowrap}
.sheet p{color:#33433c}

/* welcome */
.welcome{min-height:100vh;display:grid;place-items:center;padding:30px 20px;text-align:center}
.welcome .orbit{width:150px;height:150px;margin:0 auto 26px;position:relative}
.welcome .orbit .core{position:absolute;inset:34px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fffbe9,#ecc97f 55%,#8a6420);box-shadow:0 0 60px rgba(236,201,127,.8);animation:pulse 3s infinite}
.welcome .orbit i{position:absolute;inset:0;border-radius:50%;border:1px dashed rgba(236,201,127,.4);animation:spin 18s linear infinite}
.welcome .orbit i::after{content:"✦";position:absolute;top:-10px;left:50%;color:var(--teal);font-size:16px;font-style:normal}
.welcome .orbit i:nth-child(2){inset:-16px;animation-duration:30s;animation-direction:reverse}
.welcome .orbit i:nth-child(2)::after{color:var(--rose)}
@keyframes spin{to{transform:rotate(360deg)}}
.welcome h1{font-size:clamp(42px,10vw,68px)}
.welcome h1 em{font-style:italic;color:var(--gold2)}
.welcome .sub{font-family:var(--display);font-size:20px;color:var(--muted);margin:10px 0 26px}
.howto{display:grid;gap:10px;text-align:left;margin:22px 0}
.howto div{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:18px;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
.howto span{font-size:26px}
.howto p{margin:0;font-size:14.5px;color:#d5e2dc}
.howto b{color:var(--ink)}

@media (min-width:860px){
  .deck{padding-top:24px}
  .cardx{padding:40px 44px}
  .collection{grid-template-columns:repeat(8,1fr)}
}
@media (max-width:520px){
  .paths,.ptoggles,.rumi{grid-template-columns:1fr}
  .grid2{grid-template-columns:1fr}
  .johari{font-size:12.5px}
  .jq{min-height:104px;padding:12px}
  .jq b{font-size:17px}
  .cardx{padding:24px 18px;border-radius:24px}
  .node{width:120px}
  .node .ttl{font-size:14.5px}
  .navbar a{min-width:58px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ===== Well Mind combined app additions ===== */
.brand{text-decoration:none}
.quests{display:grid;gap:10px}
.quests .quest .orb{flex-basis:50px;height:50px;font-size:22px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px;border-radius:20px;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.seg button{border:0;border-radius:15px;padding:12px 10px;background:transparent;color:var(--muted);text-align:center;transition:background .2s}
.seg button b{display:block;font-family:var(--display);font-weight:500;font-size:16px;color:var(--ink)}
.seg button small{font-size:11.5px}
.seg button.on{background:linear-gradient(135deg,rgba(236,201,127,.22),rgba(127,216,198,.12));box-shadow:inset 0 0 0 1px var(--line)}
.seg button.on b{color:var(--gold2)}
.date-stepper{display:flex;align-items:center;justify-content:center;gap:16px;margin:0 0 14px}
.date-stepper strong{font-family:var(--display);font-weight:500;font-size:20px;min-width:140px;text-align:center}
.date-stepper .iconbtn[disabled]{opacity:.3}
.cardx h3.ph{font-size:19px;color:#1d2b26;margin:24px 0 6px}
.cardx select,.cardx .field input[type=number],.cardx .field input[type=text]{width:100%;border:0;border-radius:14px;padding:13px 15px;background:#f1ebdd;color:#1d2b26;box-shadow:inset 0 0 0 1px rgba(29,43,38,.08);font-size:16px}
.cardx select:focus,.cardx .field input:focus{outline:none;background:#fff;box-shadow:inset 0 0 0 2px var(--c)}
.cardx .hint{display:block;font-size:12.5px;color:#6b7a73;margin-top:6px}
.input-unit{display:flex;align-items:center;border-radius:14px;background:#f1ebdd;box-shadow:inset 0 0 0 1px rgba(29,43,38,.08);padding-right:12px}
.input-unit input{box-shadow:none!important;background:transparent!important;flex:1;min-width:0}
.input-unit span{color:#6b7a73;font-size:13px;white-space:nowrap}
.input-unit:focus-within{background:#fff;box-shadow:inset 0 0 0 2px var(--c)}
.slider-field .sl{display:flex;align-items:center;gap:12px}
.slider-field input[type=range]{flex:1;accent-color:var(--c);height:28px}
.slider-field input.unset{opacity:.4;filter:grayscale(1)}
.slider-field .scaleval{min-width:36px;text-align:right}
details.more{margin-top:20px;border-radius:16px;background:#f2ece0;padding:12px 14px}
details.more summary{cursor:pointer;font-weight:700;color:#1d2b26}
details.more .field{margin-top:12px}
.mini-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.mini-stats div{text-align:center;padding:10px 4px;border-radius:14px;background:rgba(255,255,255,.05)}
.mini-stats b{display:block;font-family:var(--display);font-size:22px;font-weight:500;color:var(--gold2)}
.mini-stats span{font-size:11.5px;color:var(--muted)}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tcard{display:flex;flex-direction:column;gap:2px;padding:18px;border-radius:22px;text-decoration:none;color:var(--ink);background:linear-gradient(150deg,color-mix(in srgb,var(--c) 22%,transparent),rgba(255,255,255,.03));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 35%,transparent);transition:transform .2s}
.tcard:hover{transform:translateY(-2px)}
.tcard .ic{font-size:22px;color:var(--c)}
.tcard b{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.tcard strong{font-family:var(--display);font-weight:500;font-size:26px;line-height:1.1}
.tcard strong small{font-size:13px;color:var(--muted)}
.tcard small{font-size:12.5px;color:var(--muted)}
.stiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.stile{padding:14px;border-radius:18px;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07);display:flex;flex-direction:column}
.stile span{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stile strong{font-family:var(--display);font-weight:500;font-size:26px;color:var(--gold2)}
.stile small{font-size:12px;color:var(--muted)}
.calorie-summary{display:grid;grid-template-columns:140px 1fr;gap:16px;align-items:center;position:relative}
.calorie-summary .ring{width:140px;height:140px;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:#ece4d3;stroke-width:12}
.ring-fg{fill:none;stroke:var(--c);stroke-width:12;stroke-linecap:round;transition:stroke-dasharray .8s}
.ring-fg.over{stroke:#f2a07a}
.ring-label{position:absolute;left:0;top:0;width:140px;height:140px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring-label strong{font-family:var(--display);font-size:28px;color:#1d2b26;line-height:1}
.ring-label span{font-size:11px;color:#6b7a73}
.calorie-equation{margin:0;display:grid;gap:6px}
.calorie-equation div{display:flex;justify-content:space-between;padding:8px 12px;border-radius:12px;background:#f2ece0}
.calorie-equation dt{color:#6b7a73;font-size:13px}.calorie-equation dd{margin:0;font-weight:700;color:#1d2b26}
.macro-bars{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.macro-bar-top{display:flex;flex-direction:column;font-size:12.5px;color:#6b7a73}
.macro-bar-top strong{color:#1d2b26;font-size:14px}
.macro-bar .bar{height:8px;border-radius:8px;background:#ece4d3;overflow:hidden;margin-top:4px}
.macro-bar .bar i{display:block;height:100%;background:var(--c);border-radius:8px}
.totals-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 0 6px}
.total-field label{display:block;font-weight:600;font-size:14px;margin-bottom:6px;color:#1d2b26}
.total-field .input-unit input{font-size:20px;padding:12px 4px 12px 14px;border:0;color:#1d2b26}
.mini-table{width:100%;border-collapse:collapse;font-size:13.5px}
.mini-table th,.mini-table td{padding:8px 6px;text-align:left;border-bottom:1px solid rgba(255,255,255,.07)}
.mini-table thead th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mini-table td small{color:var(--muted)}
.mini-table tr.current th,.mini-table tr.current td{color:var(--gold2)}
.acttypes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acttype{border:0;border-radius:18px;padding:14px;text-align:left;background:#f2ece0;color:#33433c;display:flex;flex-direction:column;gap:2px;transition:transform .15s}
.acttype:hover{transform:translateY(-2px)}
.acttype span{font-size:24px}.acttype b{color:#1d2b26}.acttype small{font-size:12px;color:#6b7a73}
.actform{padding:14px;border-radius:18px;background:#f6f1e6}
.actlist{list-style:none;padding:0;margin:16px 0 0;display:grid;gap:8px}
.actlist li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:#f2ece0;color:#1d2b26}
.actlist li span:first-child{font-size:20px}
.actlist li span:nth-child(2){flex:1}
.actlist .iconbtn{width:34px;height:34px;border-radius:10px}
.wchart{width:100%;height:auto}
.wchart .wl{font-size:10px;fill:#c9d8d1}
.goals{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.goal{border:0;border-radius:18px;padding:14px;text-align:left;background:#f2ece0;color:#33433c;display:flex;flex-direction:column;gap:3px;transition:all .2s}
.goal b{font-family:var(--display);font-size:18px;font-weight:500;color:#1d2b26}
.goal small{font-size:12.5px;color:#6b7a73}
.goal.on{background:color-mix(in srgb,var(--c) 45%,#fff);box-shadow:0 10px 24px color-mix(in srgb,var(--c) 40%,transparent),inset 0 0 0 2px var(--c)}
.ttiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.ttiles div{padding:12px 8px;border-radius:16px;background:#f2ece0;text-align:center}
.ttiles span{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#6b7a73}
.ttiles strong{display:block;font-family:var(--display);font-size:24px;font-weight:500;color:#1d2b26}
.ttiles small{font-size:11px;color:#6b7a73}
details.explain{margin-top:8px;padding:12px 14px;border-radius:14px;background:#f6f1e6;font-size:14px}
details.explain summary{cursor:pointer;font-weight:700;color:#2f6b5b}
details.explain ol{padding-left:18px;color:#33433c}
.obprog{list-style:none;display:flex;gap:6px;padding:0;margin:calc(10px + var(--safe-t)) 0 16px;overflow-x:auto}
.obprog li{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted);min-width:70px;text-align:center}
.obprog li span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.07);font-weight:700;color:var(--ink)}
.obprog li.cur span{background:var(--gold);color:#1d2b26;box-shadow:0 0 20px rgba(236,201,127,.6)}
.obprog li.cur{color:var(--gold2)}
.obprog li.done span{background:var(--teal);color:#1d2b26}
.leader-mini{margin:22px 0 6px;padding:12px 14px;border-radius:16px;background:linear-gradient(150deg,#1a3a31,#0f241f);color:var(--gold2);font-family:var(--display);font-size:18px}
.leader-q{font-style:italic}
.feel.dark{background:rgba(255,255,255,.06);color:var(--ink);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.feel.dark.on{background:var(--c,var(--gold));color:#13211c}
.collection{grid-template-columns:repeat(5,1fr)}
@media (min-width:860px){.collection{grid-template-columns:repeat(9,1fr)}}
@media (max-width:520px){
  .calorie-summary{grid-template-columns:1fr;justify-items:center}
  .ring-label{left:50%;transform:translateX(-50%)}
  .calorie-equation{width:100%}
  .ttiles{grid-template-columns:1fr 1fr}
  .mini-stats{grid-template-columns:1fr 1fr}
  .goals,.acttypes{grid-template-columns:1fr}
  .navbar a{min-width:0;flex:1;padding:8px 6px}
  .navbar nav{width:100%;justify-content:space-between}
}

/* ===== logo ===== */
.brand .mark{background:#fbf7ee;padding:2px;width:38px;height:38px;border-radius:50%;box-shadow:0 0 0 1px rgba(236,201,127,.5),0 0 18px rgba(236,201,127,.25)}
.brand .mark img{width:100%;height:100%;object-fit:contain;display:block}
.welcome .orbit{width:190px;height:190px}
.welcome .orbit .core{inset:24px;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,#fffdf6,#f4ead2 70%,#e9d7a8);box-shadow:0 0 60px rgba(236,201,127,.65),0 0 0 1px rgba(236,201,127,.6)}
.welcome .orbit .core img{width:78%;height:78%;object-fit:contain}
.logo-plaque{display:grid;place-items:center;margin:0 0 16px;padding:22px;border-radius:24px;background:#fbf7ee;box-shadow:var(--shadow)}
.logo-plaque img{width:min(300px,80%);height:auto}

<script>
// Understanding Yourself — content from Ger Boland's journal (One Step Forward · Well Mind).
// Card builder helpers. Field ids are "<chapterKey>.<key>".
const card = (title, o = {}) => ({ t: 'card', title, ...o });
const game = (g, title, o = {}) => ({ t: 'game', g, title, ...o });
const leader = (key, q) => ({ t: 'leader', key, q });
const next = (g, n, o, s, note) => ({ t: 'next', g, n, o, s, note });

const START_QS = [
  ['s1', 'What feels most like me in my life right now?'],
  ['s2', 'Where do I hide, please or push myself against what I feel?'],
  ['s3', 'How do I respond to myself when something is difficult?'],
  ['s4', 'What do I need more of, and what makes it hard to ask?'],
  ['s5', 'When do I feel understood? How do I check whether others feel understood by me?'],
  ['s6', 'What would living a little closer to myself look like?'],
];

const WHEEL_AREAS = ['Rest & energy', 'Food & body care', 'Movement', 'Relationships', 'Work & money', 'Home & support', 'Play & creativity', 'Meaning & self'];

const VALUES = 'Achievement Adventure Adaptability Ambition Authenticity Awareness Charity Cheerfulness Compassion Competence Consistency Consideration Control Cooperation Courage Courtesy Creativity Curiosity Decisiveness Dedication Determination Diligence Diversity Education Efficiency Empathy Enthusiasm Equality Excellence Excitement Fairness Faith Fidelity Focus Forgiveness Freedom Friendship Fun Generosity Gratitude Growth Happiness Helping Honesty Hope Humility Independence Initiative Integrity Intelligence Joy Justice Kindness Knowledge Leadership Love Loyalty Mastery Moderation Openness Originality Passion Patience Playfulness Positivity Power Privacy Professionalism Reason Recognition Reliability Religion Resilience Respect Responsibility Safety Selflessness Sensitivity Spontaneity Stability Structure Success Supportiveness Thoughtfulness Tolerance Trust Understanding Usefulness Virtue Wealth Wisdom Work'.split(' ');

const FEELINGS = ['Calm', 'Sad', 'Worried', 'Angry', 'Hopeful', 'Unsure'];
const HELPS = ['Rest', 'Space', 'Connection', 'Practical help'];

const UY = [
  {
    n: 1, key: 'c01', title: 'Thoughts & feelings', glyph: '✦', hue: '#7fd8c6',
    consider: 'What would I like to understand rather than immediately fix?',
    intro: ['Separate the event, your reaction and the meaning you gave it. This can reveal a useful question or next step.'],
    insight: 'Reflection can bring clarity. You are allowed a stopping point.',
    steps: [
      card('A simple way in', {
        list: [['What happened?', 'Describe what someone could have observed.'], ['What happened inside me?', 'Name feelings, thoughts or body sensations.'], ['What meaning did I give it?', 'Notice an interpretation without treating it as the only possible truth.'], ['What do I need now?', 'A step, support, rest, information or nothing further today.']],
        qs: [['taking', 'Today, the thing taking up space in me is…']],
      }),
      card('My starting reflection', { body: ['Optional: choose one question now, or return when you feel ready. These prompts appear again in Return & reflect so you can notice change over time.'], qs: START_QS }),
      game('rumination', 'Reflection or rumination?', {
        body: ['Reflection can bring clarity. Rehearsing the same argument can deepen distress. Notice which is happening and set a stopping point.'],
        qs: [['know', 'What do I know from observation? What am I guessing?'], ['leave', 'One question I can leave unanswered for now:']],
      }),
      next('Has the question I arrived with changed?', 'What became clearer, and what is still uncertain?', 'Close the book, take a small step, ask someone or return later?', 'My stopping point today is … Afterwards I will …', 'If distress persists or writing repeatedly overwhelms you, a counsellor or other qualified professional can help you explore a different approach.'),
    ],
  },
  {
    n: 2, key: 'c02', title: 'Morals & values', glyph: '◆', hue: '#f2c879',
    consider: 'What part of life would I like to feel more chosen?',
    intro: ['A goal is an outcome: finish a course or have a better conversation. A value guides how you act: curiosity, care or honesty. The same value can support several different goals.', 'Choose ten values, narrow to five, then three that matter most in your present situation.'],
    insight: 'A goal is where you are going. A value is how you want to travel.',
    steps: [
      game('values', 'A vocabulary of values', { qs: [['words', 'My words – and what they mean in my life:'], ['protect', 'Which one would I most want to protect in a difficult decision?']] }),
      card('Where my values came from', {
        body: ['A moral belief concerns what you see as right or wrong; a value names what matters to you.', 'They can overlap. You might value fairness and believe it is wrong to exploit someone. Both can be shaped by family, culture, school, religion, peers and experience. You can examine them respectfully without needing to reject your background.'],
        qs: [['fam', 'Family of origin', 'Qualities or rules strongly valued — and what I choose now'], ['culture', 'Country / culture / society', 'Qualities or rules strongly valued — and what I choose now'], ['community', 'Religion / school / community', 'Qualities or rules strongly valued — and what I choose now'], ['peers', 'Friends / teams / peers', 'Qualities or rules strongly valued — and what I choose now'], ['inherited', 'Which inherited values still feel like mine? Which do I follow from fear of disapproval?'], ['protecthere', 'What value would I protect most here, and why?']],
      }),
      card('Values in action', {
        qs: [['action', 'A value I choose — what it looks like in a small action — and what gets in the way']],
        example: 'Lee values connection and agrees to every invitation. Exhaustion makes the time together feel resentful. A smaller, honest invitation may express connection more clearly than another automatic yes.',
        qs2: [['living', 'Where am I already living one of my values, even imperfectly?'], ['performing', 'Where might I be performing a value for approval?']],
      }),
      leader('leader', 'What would they do if a choice needed both courage and care?'),
      card('When values compete', {
        reflection: true,
        body: ['Values can pull in different directions. You do not need to decide that one is always superior. Ask what this situation needs, what the costs are and what is within your control. Sometimes a good choice includes disappointment or a trade-off.'],
        qs: [['decision', 'A current decision and the values pulling on each side:'], ['respect', 'What would respect both values as much as my circumstances allow?']],

      next('What would a more chosen response look like now?', 'What limits or trade-offs do I need to acknowledge?', 'Which small actions could express the value?', 'I choose … because it supports …'),

  },
  {
    n: 3, key: 'c03', title: 'Self-awareness & feedback', glyph: '◐', hue: '#9ec5ff',

    intro: ['The Johari Window, introduced by Joseph Luft and Harrington Ingham, separates what is known to you and what is known to others. It is a conversation aid, not a personality test. No person can see all of you.'],
    insight: 'Feedback is a perspective to consider, not an automatic truth.',
    steps: [

      card('Private & unknown', {
        qs: [['confident', 'What do I know about myself with confidence? What examples support it?'], ['hidden', 'What do I tend to keep hidden, and what am I protecting?'], ['share', 'Is there one small thing I could safely share with someone suitable?'], ['uncertain', 'Where do I feel uncertain about myself? What experience might help me learn?']],
        note: 'The unknown area can include a skill you have not tried, an unfamiliar reaction or a preference you have not yet discovered. A new experience offers information; it does not require you to reveal everything about yourself.',

        qs: [['about', 'What I would like feedback about – and why this person is suitable:'], ['said', 'What they actually said / a concrete example:'], ['fits', 'What fits my experience? What does not? What needs checking?']],

  },
  {
    n: 4, key: 'c04', title: 'Attachment & connection', glyph: '❋', hue: '#f4a6b7',
    consider: 'What would I like to understand about connection?',
    intro: ['Adult attachment research often describes two dimensions: anxiety about rejection or availability, and avoidance of closeness or dependence. These tendencies can vary between relationships and over time. A journal cannot diagnose your attachment style or explain another person’s behaviour.'],
    insight: 'A need for space can be healthy. A request for reassurance can be reasonable.',
    steps: [
      card('When uncertainty rises', {
        table: { head: ['When uncertainty rises', 'A possible response to notice'], rows: [['I worry connection will disappear.', 'Seeking repeated reassurance, monitoring, protesting or finding it hard to settle.'], ['Closeness feels demanding or unsafe.', 'Pulling back, minimising needs, handling everything alone or avoiding a conversation.'], ['Both pulls are present.', 'Wanting closeness while fearing or resisting it.'], ['Connection feels secure enough.', 'Seeking support, allowing space and discussing needs with some flexibility.']] },
        note: 'These are broad examples, not a scoring system. A need for space can be healthy; a request for reassurance can be reasonable. Context and the other person’s actual behaviour matter. Sources: Fraley and colleagues (2000; 2011).',
      }),
      card('Before I react', {
        qs: [['event', 'What happened – the observable event:'], ['story', 'The story I told myself about the connection:'], ['feeling', 'Inside: feeling / body response'], ['did', 'Outside: what I did or wanted to do'], ['need', 'The need underneath:'], ['impact', 'How the other person might have experienced my response:'], ['intention', 'What do I know about their intention? What could I ask instead of guessing?']],
        note: 'Common labels include secure, anxious, dismissive-avoidant and fearful-avoidant. They are shorthand for patterns, not permanent categories. Adult fearful avoidance should not be treated as identical to a childhood disorganised-attachment classification.',
      }),
      card('Practise a secure response', {
        table: { head: ['If I notice…', 'Something I could practise'], rows: [['Anxious reactions', 'Pause before acting; separate observations from feared meanings; make one clear request and use other sources of support.'], ['Avoidant reactions', 'Name a need for space without disappearing. Agree when to return. Share a small truth when trust and safety allow.'], ['Fearful-avoidant reactions', 'Slow the pace. Prioritise safety, predictable communication and small consistent experiences of trust.'], ['Secure responses', 'Continue clear requests, boundaries, repair, mutual support and respect for independence.']] },
        qs: [['conflict', 'During conflict, do I approach, withdraw, freeze, attack, explain or please? What would a small alternative be?'], ['practise', 'One action I could practise with a suitable person:']],
        resource: ['Optional attachment questionnaire information / R. Chris Fraley', 'labs.psychology.illinois.edu/~rcfraley/resources.html', 'This researcher’s page links to online self-report questionnaires. Results can start a reflection; they are not a diagnosis or a final description of you. Check any participation and privacy information before submitting answers.'],
      }),
      card('My next connection', {
        reflection: true,
        body: ['A small response might be asking for a clear arrangement, naming a need, allowing agreed space, soothing yourself before replying or recognising that the relationship is not offering enough safety or consistency. The aim is not to blame yourself for reacting.'],
        qs: [['ask', 'What I actually need to ask for:'], ['sentence', 'A sentence I could use, without claiming to know their mind:', 'For example: “I noticed I became worried when plans changed. Could we agree how to let each other know?”']],
      }),
      next('What kind of connection do I want to support?', 'Which response is mine, and which circumstances are outside my control?', 'What could I ask, practise, accept or step away from?', 'The next supported step I choose is …'),
    ],
  },
  {
    n: 5, key: 'c05', title: 'Living congruently', glyph: '☾', hue: '#c4b2ff',
    consider: 'Where do I want a little more honesty with myself?',
    intro: ['In person-centred thinking, incongruence can describe a mismatch between experience and the way we understand ourselves. I might see myself as someone who never needs help, while feeling exhausted and wanting support. Noticing the mismatch can make room for a more flexible understanding of myself.', 'Congruence does not mean announcing every thought, acting on every feeling or sharing what is unsafe to share. Private acknowledgement can be an honest beginning. A feeling can be real without being an instruction.'],
    insight: 'A feeling can be real without being an instruction.',
    steps: [
      card('The story and the experience', { qs: [['story', 'The story I tell about myself is…'], ['experience', 'My experience today is…']] }),
      card('One ordinary day', { qs: [['feel', 'What feeling would I like to make more room for – calm, courage, clarity, playfulness or something else? Why?'], ['meaningful', 'If I did one meaningful thing, what would it be and which value would it support?'], ['thirty', 'At thirty percent energy, what would the minimum version look like?'], ['win', 'A small win: when did I feel alive, peaceful or real? What does that tell me?'], ['honesty', 'What would five percent more honesty with myself look like?']] }),
      card('A more honest choice', { reflection: true, qs: [['worry', 'What do I worry would happen if I admitted this feeling or need?'], ['approval', 'Whose approval or expectation am I trying to protect?'], ['kinder', 'A kinder, more accurate sentence about myself:', 'For example: “I can be dependable and sometimes need help.” Use your own words.']] }),
      leader('leader', 'What would honest care look like here – including care for me?'),
      next('Has my idea of an honest choice changed?', 'What am I able to acknowledge now?', 'What can stay private, and what might be useful to communicate?', 'I will express this value … through this small action …'),
    ],
  },
  {
    n: 6, key: 'c06', title: 'Did we reach each other?', glyph: '∞', hue: '#8fe3a8',
    consider: 'What kind of connection would I like in this situation?',
    intro: ['Carl Rogers proposed six conditions for therapeutic change in 1957. Here, they inspire reflection on everyday relationships. The original therapy conditions and their everyday applications are distinct.'],
    insight: 'Your intention alone cannot establish that care was experienced. You can ask how it landed.',
    steps: [
      card('Six lenses for everyday life', {
        table: { head: ['Original condition, in brief', 'Everyday question here'], rows: [['Psychological contact', 'Are we actually reaching one another?'], ['Client incongruence / vulnerability', 'What mismatch or uncertainty needs care?'], ['Therapist congruence', 'Can I be genuine and considerate?'], ['Unconditional positive regard', 'Can I respect the person while having limits?'], ['Empathic understanding', 'Am I trying to understand their frame of reference?'], ['Some empathy and regard are received', 'How did my response actually land?']] },
        note: 'Choose one manageable interaction for the next cards. You can reflect privately; the other person does not have to take part. If a relationship is controlling or unsafe, prioritise support and safety rather than trying harder to create mutual understanding.',
      }),
      card('Psychological contact', {
        body: ['In Rogers’ original formulation, two people are in psychological contact. In everyday reflection, ask whether each person had a meaningful opportunity to notice and respond to the other. Physical closeness or eye contact alone cannot tell you that.', 'Eye contact is not the only sign of listening. Consider communication differences, access, fatigue, language, timing and distractions before interpreting a response as a lack of care.'],
        qs: [['interaction', 'The interaction I am reflecting on – when, where and what happened:'], ['expected', 'What did I expect contact to look like? When they communicated differently, did I become curious, judge, get angry or withdraw?'], ['observed', 'What did I observe that suggested we were connecting? What am I only assuming?']],
        callout: ['Try a small check', '“Is this a good time?” “Would another way of talking work better?” “Have I understood what you want to discuss?”'],
      }),
      card('Vulnerability & mismatch', {
        body: ['Rogers described the client as incongruent, vulnerable or anxious. An everyday adaptation is to wonder whether someone’s experience conflicts with what they believe they should feel or be. That is a possibility to explore, not something to diagnose in them.', 'You might say “I’m fine” while feeling hurt because being upset seems unacceptable. Or you may not yet know what you feel. Hesitation is not proof of dishonesty. Someone can also choose privacy for a good reason.'],
        qs: [['inside', 'What was happening inside me, as far as I can tell?'], ['supposed', 'What did I think I was supposed to feel or show?'], ['assuming', 'What might I be assuming about the other person’s feelings?'], ['safer', 'What could make the conversation safer or easier without demanding disclosure?']],
        note: 'Use “I wonder…” rather than “You are…”. The person can correct your understanding or decline to discuss it.',
      }),
      card('Genuineness', {
        body: ['Rogers’ third condition concerns the therapist’s congruence within the relationship. In ordinary life, you can ask whether your words fit your experience, and whether expressing something will help the interaction. Being genuine is not the same as unloading every reaction.'],
        quotes: [['An honest acknowledgement', '“I want to listen, and I am too distracted to do that well right now. Could we return to this after dinner?”'], ['A feeling with ownership', '“I felt hurt when the plan changed. I want to check what happened before I assume why.”']],
        qs: [['said', 'What I said or showed:'], ['inside', 'What I was experiencing inside:'], ['difference', 'Was there a difference? What was I protecting or avoiding?'], ['honest', 'A more honest and considerate response I could choose:']],
      }),
      card('Respect & limits', {
        body: ['Unconditional positive regard describes an accepting, caring attitude towards the client as a person. In this everyday adaptation, you can separate someone’s dignity from agreement with an action. You can care about a person and still say that something is unacceptable.', 'Respect does not require tolerating abuse, abandoning your values or remaining in a relationship. You also deserve regard. A boundary can be part of care when it is clear about behaviour and what you will do.'],
        qs: [['require', 'What do I require before I offer warmth or acceptance? Is my love or regard conditional?'], ['behind', 'What is behind that condition? Am I rejecting a behaviour or the whole person?'], ['limit', 'What limit or need matters here?']],
        callout: ['A sentence to adapt', '“You matter to me, and I am not willing to continue this conversation while I am being shouted at. I will pause and return when we can speak safely.”'],
      }),
      leader('leader', 'How would they hold someone accountable while protecting dignity – including their own?'),
      card('Empathy', {
        body: ['Rogers described empathic understanding of the client’s internal frame of reference. In an ordinary conversation, this means trying to grasp how the situation feels and means something to the other person, while remembering that your understanding may be incomplete.', 'You need not agree with every belief, accept harmful behaviour or have the same experience. Advice can wait while you check whether the person wants understanding, practical help or both.'],
        qs: [['viewpoint', 'From their viewpoint, what might matter most?'], ['theysaid', 'What did they actually say that supports my understanding?'], ['check', 'What could I ask to check it?', 'For example: “It sounds as if being left out hurt most. Is that close, or have I missed something?”'], ['corrected', 'If they correct me, how can I stay curious instead of defending my first guess?']],
      }),

        qs: [['ofi', 'In my situation: what is an observation, a feeling and an interpretation?'], ['askfirst', 'What might I ask before assuming which kind of help is wanted?']],

      }),

        qs: [['intent', 'My intention — what I know was received — what I still need to check'], ['landed', 'Could I ask “How did that land?” and listen before explaining what I meant?'], ['recognise', 'How do I recognise care? Have I told the other person what helps?']],
        note: 'Someone may be unable or unwilling to answer. That is information about the situation, not proof that you failed the relationship. You remain responsible for your conduct, not for controlling another person’s response.',
      }),

        body: ['Care may be present but not reaching you; it may also be missing. You do not have to talk yourself out of your experience because someone says they meant well. Explore what happened without deciding the explanation before you begin.'],
        qs: [['when', 'When did I feel understood, accepted or met? When did I not?'], ['what', 'What happened, and how did it affect me?'], ['told', 'Have I told them how I experience this? If not, what makes that difficult?'], ['safe', 'Would speaking be safe and useful? Do I need a conversation, boundary, support or distance?']],

const EW_PAGES=[{"number": 7, "title": "Steps, at my own pace", "items": [{"k": "t", "t": "A step count is optional. It can help you notice a pattern; it is not a score for the value of your day."}, {"k": "h", "t": "Do it"}, {"k": "t", "t": "iPhone: Open Health and find Steps. If it is not in your Summary, add it to Pinned. Open the step chart and select the day you want to record."}, {"k": "t", "t": "Apple / Health setup and step data Official instructions. A watch is not required to use iPhone step data. support.apple.com/en-ie/104997"}, {"k": "t", "t": "Android, if using Google Fit: Open Fit, tap Steps, then choose the day. Use the count shown for that date."}, {"k": "t", "t": "Google Fit / Find your activity Official instructions for finding daily and weekly activity. support.google.com/fit/answer/6090183"}, {"k": "h", "t": "Understand it"}, {"k": "t", "t": "Use the same device where possible, and note when you did not carry or wear it. Do not add phone and watch totals together. Numbers can be incomplete or inaccurate."}, {"k": "t", "t": "No tracker, or steps are not useful for you? Describe your movement, time outdoors, a seated activity or an everyday task instead. There is no universal step target in this journal."}, {"k": "f", "id": "p07_reflection_001", "l": "What would I like movement to support in my everyday life?", "ty": "text"}, {"k": "t", "t": "Record yesterday’s total on Daily check-in · p. 2. For optional task observations, see Fitness checks · p. 37. Apps, menus and permissions can change; use the official help links above."}]}, {"number": 8, "title": "Sleep & recovery", "items": [{"k": "f", "id": "p08_chapter_focus_002", "l": "What would better-supported rest make possible?", "ty": "text"}, {"k": "t", "t": "Sleep supports how we feel and function. Helpful habits include a fairly regular sleep schedule, a quieter wind-down, daylight and suitable activity during the day, and a dark, quiet sleeping space. Caffeine later in the day and alcohol near bedtime can interfere with sleep."}, {"k": "t", "t": "Shift work, caring, pain and health conditions can change what is realistic. Choose an action within your influence. You cannot command yourself to fall asleep."}, {"k": "h", "t": "Notice the opportunity"}, {"k": "h", "t": "Notice the experience"}, {"k": "t", "t": "How much time have I left for sleep? What gets squeezed into that time?"}, {"k": "t", "t": "Do I feel restored? Am I waking often? What else might be affecting me?"}, {"k": "f", "id": "p08_reflection_003", "l": "What might I protect or ask for before buying another sleep product?", "ty": "text"}, {"k": "h", "t": "What would a great leader do?"}, {"k": "t", "t": "Would they ask for more effort, or make recovery possible?"}, {"k": "t", "t": "General sleep-habit guidance: NHLBI. Persistent sleep difficulty, marked daytime sleepiness or breathing concerns deserve a clinical conversation; journalling is not treatment for a sleep disorder."}]}, {"number": 9, "title": "An evening routine", "items": [{"k": "c", "c": ["A possibility", "My version"]}, {"k": "f", "id": "p09_table_004", "l": "My version / A more regular wake time, where realistic / row 1", "ty": "text"}, {"k": "f", "id": "p09_table_005", "l": "My version / A short wind-down before bed / row 2", "ty": "text"}, {"k": "f", "id": "p09_table_006", "l": "My version / Move a late caffeinated drink earlier / row 3", "ty": "text"}, {"k": "f", "id": "p09_table_007", "l": "My version / Ask for practical help with evening demands / row 4", "ty": "text"}, {"k": "f", "id": "p09_inline_008", "l": "Tonight I will try __________ because __________.", "ty": "text"}, {"k": "h", "t": "MY NEXT STEP"}, {"k": "f", "id": "p09_inline_011", "l": "Is rest still the change I want to support? __________", "ty": "text"}, {"k": "f", "id": "p09_inline_012", "l": "What helped, what was difficult, and what remains unclear? __________", "ty": "text"}, {"k": "f", "id": "p09_inline_013", "l": "Keep, simplify, change or ask for support? __________", "ty": "text"}, {"k": "f", "id": "p09_inline_014", "l": "I will carry __________ into my next evening and review on __________.", "ty": "text"}, {"k": "t", "t": "The Matt Walker Podcast / episode 145 Optional listen: How to get More Deep Sleep. Matthew Walker is a sleep researcher, not a medical doctor. themattwalkerpodcast.buzzsprout.com/1821163/episodes/19553110-145-how-to-get-m ore-deep-sleep"}]}, {"number": 10, "title": "Everyday self-care", "items": [{"k": "f", "id": "p10_chapter_focus_016", "l": "What part of me or my day needs attention?", "ty": "text"}, {"k": "t", "t": "Self-care includes food, rest, healthcare, support, limits, connection and pleasure. Identify the need first; choose a response that fits your resources."}, {"k": "c", "c": ["A kind of care", "What it could mean for me"]}, {"k": "c", "c": ["Body", "Food, water, rest, comfort or appropriate healthcare."]}, {"k": "c", "c": ["Mind + feelings", "Less stimulation, reflection, support, learning or a pause."]}, {"k": "c", "c": ["Relationships", "Company, honesty, repair, distance or a clear request."]}, {"k": "c", "c": ["Practical life", "Money advice, an easier routine, shared tasks or accessible support."]}, {"k": "c", "c": ["Meaning + play", "Something enjoyable, absorbing or connected to what matters."]}, {"k": "f", "id": "p10_reflection_017", "l": "What do I keep calling a luxury that may actually be a need?", "ty": "text"}]}, {"number": 11, "title": "Care for body & mind", "items": [{"k": "h", "t": "Body"}, {"k": "f", "id": "p11_checkbox_018", "l": "Eat regularly", "ty": "checkbox"}, {"k": "f", "id": "p11_checkbox_020", "l": "Choose food that supports me", "ty": "checkbox"}, {"k": "f", "id": "p11_checkbox_022", "l": "Move in a way that suits me", "ty": "checkbox"}, {"k": "f", "id": "p11_checkbox_024", "l": "Get enough rest", "ty": "checkbox"}, {"k": "f", "id": "p11_checkbox_026", "l": "Take breaks", "ty": "checkbox"}, {"k": "f", "id": "p11_checkbox_028", "l": "Spend time outdoors", "ty": "checkbox"}, {"k": "f", "id": "p11_checkbox_030", "l": "Reduce unhelpful screen use", "ty": "checkbox"}, {"k": "f", "id": "p11_checkbox_032", "l": "Wear comfortable clothes", "ty": "checkbox"}, {"k": "f", "id": "p11_checkbox_034", "l": "Attend to health needs", "ty": "checkbox"}, {"k": "f", "id": "p11_checkbox_036", "l": "Make room for physical enjoyment", "ty": "checkbox"}, {"k": "h", "t": "Mind"}, {"k": "f", "id": "p11_checkbox_019", "l": "Reflect or journal", "ty": "checkbox"}, {"k": "f", "id": "p11_checkbox_021", "l": "Learn something new", "ty": "checkbox"}, {"k": "f", "id": "p11_checkbox_023", "l": "Read or listen to something meaningful", "ty": "checkbox"}, {"k": "f", "id": "p11_checkbox_025", "l": "Be curious", "ty": "checkbox"}, {"k": "f", "id": "p11_checkbox_027", "l": "Try an unfamiliar experience", "ty": "checkbox"}, {"k": "f", "id": "p11_checkbox_029", "l": "Reduce avoidable stress", "ty": "checkbox"}, {"k": "f", "id": "p11_checkbox_031", "l": "Notice thought patterns", "ty": "checkbox"}, {"k": "f", "id": "p11_checkbox_033", "l": "Allow unstructured mental space", "ty": "checkbox"}, {"k": "f", "id": "p11_checkbox_035", "l": "Make time for a hobby", "ty": "checkbox"}, {"k": "f", "id": "p11_checkbox_037", "l": "Ask for professional support when needed", "ty": "checkbox"}, {"k": "f", "id": "p11_reflection_038", "l": "What is already helping? What feels missing?", "ty": "text"}, {"k": "f", "id": "p11_reflection_039", "l": "One small action and what would make it easier:", "ty": "text"}]}, {"number": 12, "title": "Care across everyday life", "items": [{"k": "h", "t": "Feelings"}, {"k": "f", "id": "p12_checkbox_040", "l": "Spend time with people I enjoy", "ty": "checkbox"}, {"k": "f", "id": "p12_checkbox_045", "l": "Stay connected", "ty": "checkbox"}, {"k": "f", "id": "p12_checkbox_047", "l": "Talk honestly about feelings", "ty": "checkbox"}, {"k": "f", "id": "p12_checkbox_051", "l": "Acknowledge effort", "ty": "checkbox"}, {"k": "f", "id": "p12_checkbox_053", "l": "Allow feelings to be present", "ty": "checkbox"}, {"k": "f", "id": "p12_checkbox_056", "l": "Make room for laughter", "ty": "checkbox"}, {"k": "f", "id": "p12_checkbox_059", "l": "Seek comfort", "ty": "checkbox"}, {"k": "f", "id": "p12_checkbox_061", "l": "Set boundaries", "ty": "checkbox"}, {"k": "f", "id": "p12_checkbox_064", "l": "Use encouraging self-talk", "ty": "checkbox"}, {"k": "f", "id": "p12_checkbox_066", "l": "Repair after conflict", "ty": "checkbox"}, {"k": "h", "t": "Work + practical life"}, {"k": "f", "id": "p12_checkbox_041", "l": "Take breaks", "ty": "checkbox"}, {"k": "f", "id": "p12_checkbox_043", "l": "Manage workload realistically", "ty": "checkbox"}, {"k": "f", "id": "p12_checkbox_048", "l": "Set limits", "ty": "checkbox"}, {"k": "f", "id": "p12_checkbox_049", "l": "Protect focused time", "ty": "checkbox"}, {"k": "f", "id": "p12_checkbox_052", "l": "Make the environment workable", "ty": "checkbox"}, {"k": "f", "id": "p12_checkbox_055", "l": "Ask for help", "ty": "checkbox"}, {"k": "f", "id": "p12_checkbox_058", "l": "Balance work and personal time", "ty": "checkbox"}, {"k": "f", "id": "p12_checkbox_062", "l": "Do meaningful tasks", "ty": "checkbox"}, {"k": "f", "id": "p12_checkbox_065", "l": "Connect with supportive colleagues", "ty": "checkbox"}, {"k": "f", "id": "p12_checkbox_068", "l": "Finish or release draining tasks", "ty": "checkbox"}, {"k": "h", "t": "Meaning + spirit"}, {"k": "f", "id": "p12_checkbox_042", "l": "Spend time in nature", "ty": "checkbox"}, {"k": "f", "id": "p12_checkbox_044", "l": "Do something meaningful", "ty": "checkbox"}, {"k": "f", "id": "p12_checkbox_046", "l": "Connect with values or faith", "ty": "checkbox"}, {"k": "f", "id": "p12_checkbox_050", "l": "Notice gratitude without forcing it", "ty": "checkbox"}, {"k": "f", "id": "p12_checkbox_054", "l": "Welcome a new perspective", "ty": "checkbox"}, {"k": "f", "id": "p12_checkbox_057", "l": "Make room for stillness", "ty": "checkbox"}, {"k": "f", "id": "p12_checkbox_060", "l": "Contribute to a community or cause", "ty": "checkbox"}, {"k": "f", "id": "p12_checkbox_063", "l": "Create, pray, meditate or reflect", "ty": "checkbox"}, {"k": "f", "id": "p12_checkbox_067", "l": "Notice awe or connection", "ty": "checkbox"}, {"k": "f", "id": "p12_checkbox_069", "l": "Act in a way I respect", "ty": "checkbox"}, {"k": "f", "id": "p12_reflection_070", "l": "My own kind of care - something these lists have missed:", "ty": "text"}]}, {"number": 13, "title": "My low-energy plan", "items": [{"k": "f", "id": "p13_reflection_071", "l": "Early signs that I am running low:", "ty": "text"}, {"k": "c", "c": ["When I have capacity", "My smaller version"]}, {"k": "f", "id": "p13_table_072", "l": "My smaller version / A meal or food plan: / row 1", "ty": "text"}, {"k": "f", "id": "p13_table_073", "l": "My smaller version / A connection or support: / row 2", "ty": "text"}, {"k": "f", "id": "p13_table_074", "l": "My smaller version / A practical task: / row 3", "ty": "text"}, {"k": "f", "id": "p13_table_075", "l": "My smaller version / Something comforting or enjoyable: / row 4", "ty": "text"}, {"k": "f", "id": "p13_reflection_076", "l": "One thing I can ask someone else to help with:", "ty": "text"}, {"k": "h", "t": "MY NEXT STEP"}, {"k": "f", "id": "p13_inline_077", "l": "Is my aim restoration, support, pleasure or something else? __________", "ty": "text"}, {"k": "f", "id": "p13_inline_078", "l": "What resources do I really have today? __________", "ty": "text"}, {"k": "f", "id": "p13_inline_079", "l": "What can wait, become smaller or be shared? __________", "ty": "text"}, {"k": "f", "id": "p13_inline_080", "l": "My act of care is __________. I will ask __________ for __________.", "ty": "text"}, {"k": "t", "t": "Care does not have to earn its place through productivity. A difficult day is information about what you need, not a failed self-care performance."}]}, {"number": 14, "title": "Food & body care", "items": [{"k": "f", "id": "p
