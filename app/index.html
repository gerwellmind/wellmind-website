      leaderNext = false;
    } else if (it.k === 'c') {
      heads.push(...it.c);
      if (!table) table = { head: it.c, rows: [] }; else table.rows.push(it.c);
    } else if (it.k === 'f') {
      if (/_date$/.test(it.id) && it.id !== 'map_date') continue;
      if (it.ty === 'checkbox') { checks.push(toggleHtml(`p:${n}:${it.id}`, cleanLabel(it, heads))); continue; }
      html += fieldHtml(`p:${n}:${it.id}`, cleanLabel(it, heads));
    }
  }
  flushTable(); flushChecks();
  if (extra.game === 'wheel') html = GAMES.wheel.html(ch, { mode: snapshots().length ? 'later' : 'first' }) + html;
  if (extra.game === 'minute') html += GAMES.minute.html();
  if (extra.resource) html += resourceHtml(extra.resource);
  if (extra.targetsNote) html += `<div class="callout"><b>Your targets are worked out for you</b>The journal uses this same equation in your profile. <a href="#profile">See my targets and how they were calculated</a>.</div>`;
  return `<article class="cardx ${back}"><div class="eyebrow">${esc(ch.title)}</div><h2>${esc(p.title)}</h2>${html}</article>`;
}

    deckEl.addEventListener('touchstart', (e) => { if (e.target.closest('textarea,input,select,button,.vchips,.sliders,table')) { x0 = null; return; } x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });

  }
}

// ---------------- events ----------------
document.addEventListener('click', (e) => {

    $$('.vchip').forEach((b) => b.classList.toggle('dim', list.length >= lim && !list.includes(b.dataset.val)));
    $('[data-vcount]').textContent = list.length; const nx = $('[data-act="values-next"]'); if (nx) nx.disabled = list.length !== lim;
    return;
  }

  if (jq) { $$('.jq').forEach((b) => b.classList.toggle('on', b === jq && !jq.classList.contains('on'))); return; }
  const dc = e.target.closest('[data-dchip]');
  if (dc) { const g = dc.dataset.dchip, cur = listOf(daily(tDate)[g]), i = cur.indexOf(dc.dataset.v), before = checkedIn(tDate); if (i >= 0) cur.splice(i, 1); else cur.push(dc.dataset.v); setDaily(tDate, g, cur.join('|')); dc.classList.toggle('on', cur.includes(dc.dataset.v)); dc.setAttribute('aria-pressed', cur.includes(dc.dataset.v)); vibrate(6); if (!before && checkedIn(tDate)) { floater(dc, '+3 ✦'); updateChrome(); } return; }
  const eff = e.target.closest('[data-effort]');
  if (eff) { actDraft.effort = actDraft.effort === eff.dataset.effort ? '' : eff.dataset.effort; $$('[data-effort]').forEach((b) => b.classList.toggle('on', b.dataset.effort === actDraft.effort)); return; }
  const col = e.target.closest('[data-color]');
  if (col) { U.art.color = col.dataset.color; saveU(); $$('.swatch').forEach((s) => s.classList.toggle('on', s === col)); $('[data-art]').innerHTML = shapeSvg(U.art.shape, U.art.color, 200); return; }
  const sh = e.target.closest('[data-shape]');
  if (sh) { U.art.shape = sh.dataset.shape; saveU(); $$('.shapebtn').forEach((s) => s.classList.toggle('on', s === sh)); $('[data-art]').innerHTML = shapeSvg(U.art.shape, U.art.color, 200); return; }
  const sug = e.target.closest('[data-sug]');
  if (sug) { const t = $(`textarea[data-f="${sug.dataset.sug}"]`); if (t) { t.value = t.value.trim() ? t.value.trim() + '\n' + sug.dataset.text : sug.dataset.text; t.dispatchEvent(new Event('input')); t.focus(); } return; }
  const sd = e.target.closest('[data-sharedays]'); if (sd) { shareSel.days = sd.dataset.sharedays; return rerender(); }
  const sp = e.target.closest('[data-sharepart]'); if (sp) { shareSel.parts[sp.dataset.sharepart] = !shareSel.parts[sp.dataset.sharepart]; return rerender(); }

  const act = e.target.closest('[data-act]');
  if (!act) return;
  const k = act.dataset.act, P = parseCh(route());
  const step = (cur, delta) => { const d = shift(cur, Number(delta)); return d > today() ? cur : d; };

    case 'tday': tDate = step(tDate, act.dataset.delta); return rerender();

    case 'mday': mDate = step(mDate, act.dataset.delta); actDraft = null; return rerender();

    case 'act-new': actDraft = { type: act.dataset.type, minutes: '', kcal: '', effort: '', name: '' }; return rerender();
    case 'act-cancel': actDraft = null; return rerender();
