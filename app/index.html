14_chapter_focus_083", "l": "What would I like food to support in my life?", "ty": "text"}, {"k": "t", "t": "Food gives us energy and nutrients. It can also hold pleasure, culture, comfort, routine and connection. Calories describe energy; they do not describe the whole nutritional value or meaning of a meal."}, {"k": "t", "t": "Protein, fibre, vitamins, minerals, hydration and enough food all matter. So do access, appetite, allergies and medical needs. A choice that is useful for someone else may be unsuitable for you."}, {"k": "f", "id": "p14_reflection_084", "l": "A meal that supports me — and what helps it happen:", "ty": "text"}, {"k": "f", "id": "p14_reflection_085", "l": "One pressure about food that I would like to question:", "ty": "text"}]}, {"number": 15, "title": "An ordinary day of eating", "items": [{"k": "t", "t": "A food diary can use words instead of numbers. Describe what happened around eating: time, company, access, hunger, satisfaction and how you felt. Avoid marking a meal as a success or failure."}, {"k": "c", "c": ["Time / meal", "What I ate or drank", "Context / appetite / satisfaction"]}, {"k": "f", "id": "p15_table_086", "l": "Time / meal / row 1", "ty": "text"}, {"k": "f", "id": "p15_table_087", "l": "What I ate or drank / row 1", "ty": "text"}, {"k": "f", "id": "p15_table_088", "l": "Context / appetite / satisfaction / row 1", "ty": "text"}, {"k": "f", "id": "p15_table_089", "l": "Time / meal / row 2", "ty": "text"}, {"k": "f", "id": "p15_table_090", "l": "What I ate or drank / row 2", "ty": "text"}, {"k": "f", "id": "p15_table_091", "l": "Context / appetite / satisfaction / row 2", "ty": "text"}, {"k": "f", "id": "p15_table_092", "l": "Time / meal / row 3", "ty": "text"}, {"k": "f", "id": "p15_table_093", "l": "What I ate or drank / row 3", "ty": "text"}, {"k": "f", "id": "p15_table_094", "l": "Context / appetite / satisfaction / row 3", "ty": "text"}, {"k": "f", "id": "p15_table_095", "l": "Time / meal / row 4", "ty": "text"}, {"k": "f", "id": "p15_table_096", "l": "What I ate or drank / row 4", "ty": "text"}, {"k": "f", "id": "p15_table_097", "l": "Context / appetite / satisfaction / row 4", "ty": "text"}, {"k": "f", "id": "p15_table_098", "l": "Time / meal / row 5", "ty": "text"}, {"k": "f", "id": "p15_table_099", "l": "What I ate or drank / row 5", "ty": "text"}, {"k": "f", "id": "p15_table_100", "l": "Context / appetite / satisfaction / row 5", "ty": "text"}, {"k": "f", "id": "p15_reflection_101", "l": "When was eating easy? When did it feel rushed, delayed or complicated?", "ty": "text"}, {"k": "f", "id": "p15_reflection_102", "l": "What do I notice about energy or mood without assuming food caused it?", "ty": "text"}, {"k": "t", "t": "Hunger and fullness signals can be affected by stress, medication, illness or a history of restrictive eating. A prescribed meal plan or individual support may be more useful than relying on appetite alone."}]}, {"number": 16, "title": "Build a satisfying meal", "items": [{"k": "t", "t": "A flexible meal might bring together a protein food, a starchy or wholegrain food, vegetables or fruit, and suitable fats. This is a starting idea, not a rule that every plate must meet. Meals across the day can supply different things."}, {"k": "c", "c": ["Part of a meal", "Possibilities I enjoy"]}, {"k": "c", "c": ["Protein", "Beans, lentils, tofu, eggs, yoghurt, fish, meat or another suitable choice."]}, {"k": "c", "c": ["Energy + fibre", "Potatoes, rice, bread, oats, pasta or other grains; wholegrain options where they suit me."]}, {"k": "c", "c": ["Colour + variety", "Fresh, frozen or tinned vegetables and fruit. Choose what I can obtain and use."]}, {"k": "c", "c": ["Flavour + fats", "Nuts, seeds, oils, spreads, sauces, herbs or spices that fit the meal and my needs."]}, {"k": "c", "c": ["Drink", "Water or another suitable drink. Individual fluid advice comes first."]}, {"k": "f", "id": "p16_reflection_103", "l": "My easy meal: the ingredients, the time it takes and why I like it:", "ty": "text"}, {"k": "f", "id": "p16_reflection_104", "l": "My low-energy or low-budget version:", "ty": "text"}, {"k": "h", "t": "What would a great leader do?"}, {"k": "t", "t": "How would they make nourishment more available, rather than turn every meal into a test?"}]}, {"number": 17, "title": "Make food easier", "items": [{"k": "h", "t": "An obstacle I can influence"}, {"k": "h", "t": "An obstacle needing support"}, {"k": "t", "t": "An empty cupboard, no lunch break planned, or a recipe that asks more energy than I have."}, {"k": "t", "t": "Limited money, inaccessible shops, swallowing difficulties, pain, caring demands or a prescribed diet."}, {"k": "f", "id": "p17_reflection_105", "l": "The difficult moment in my food routine is usually…", "ty": "text"}, {"k": "f", "id": "p17_reflection_106", "l": "What is the smallest useful change to the situation?", "ty": "text"}, {"k": "c", "c": ["When energy is available", "When energy is low"]}, {"k": "f", "id": "p17_table_prompt_107", "l": "A food I can prepare / obtain:", "ty": "text"}, {"k": "f", "id": "p17_table_prompt_108", "l": "A food I can keep ready:", "ty": "text"}, {"k": "f", "id": "p17_table_prompt_109", "l": "A person or service I could ask:", "ty": "text"}, {"k": "f", "id": "p17_table_prompt_110", "l": "An easier way to eat enough:", "ty": "text"}, {"k": "f", "id": "p17_reflection_111", "l": "A food I enjoy and want to keep room for:", "ty": "text"}]}, {"number": 18, "title": "Fullness & satisfaction", "items": [{"k": "t", "t": "Protein can support fullness. Fibre, food volume, flavour, texture and eating enough also matter. A meal that suits one person may leave another hungry. Notice your pattern across a few ordinary meals before making a sweeping conclusion."}, {"k": "t", "t": "In a small controlled study, 20 adults ate freely from an ultra-processed menu and an unprocessed menu for two weeks each. They ate about 500 more calories a day on the ultra-processed menu, gaining an average 0.9 kg while losing 0.9 kg on the other menu. The gain was not all fat. This study compared whole menus; it did not test the brands in this journal or predict an individual result."}, {"k": "h", "t": "Try looking at the whole meal"}, {"k": "t", "t": "At home or with a takeaway, consider the food you enjoy, a protein source, available vegetables and portions that fit your appetite and circumstances. Sauces, sides and drinks are part of the meal too. Convenience foods can be useful; processing alone is not a complete guide to nutritional value."}, {"k": "f", "id": "p18_reflection_112", "l": "A meal that usually keeps me satisfied:", "ty": "text"}, {"k": "f", "id": "p18_reflection_113", "l": "What could I add or change in a meal that leaves me wanting more?", "ty": "text"}]}, {"number": 19, "title": "Choose your approach", "items": [{"k": "c", "c": ["Route", "What I will notice"]}, {"k": "c", "c": ["Food awareness", "Regular access to meals, satisfaction, variety, enjoyment and practical support."]}, {"k": "c", "c": ["Optional food logging", "A brief record of portions or nutrients to answer a specific question."]}, {"k": "c", "c": ["Optional energy planning", "Rough estimates for an appropriate adult goal, with the limitations that follow."]}, {"k": "c", "c": ["Optional weighing", "A longer-term pattern, only if the information is useful and emotionally manageable."]}, {"k": "t", "t": "If numbers increase anxiety, guilt, repeated checking or rigid eating, use the awareness route and consider appropriate support. No body size requires you to complete the weight pages."}, {"k": "t", "t": "Before using the calculations These estimates are for adults. Do not use them as self-directed targets for under-18s, pregnancy or breastfeeding. With low weight, unintended weight loss, an eating-disorder history, kidney disease, a prescribed diet or medicines that can cause low blood sugar, seek individual dietetic or clinical advice."}, {"k": "f", "id": "p19_reflection_114", "l": "The question I want a tool to answer is…", "ty": "text"}, {"k": "f", "id": "p19_reflection_115", "l": "My route for now, and how I will know the tool is no longer helping:", "ty": "text"}]}, {"number": 20, "title": "Energy balance", "items": [{"k": "t", "t": "Your body uses energy to keep you alive, digest food and do everyday activities. Over time, the relationship between intake and expenditure influences body weight. It is not a simple explanation of your health, habits or worth."}, {"k": "t", "t": "Pattern over time"}, {"k": "t", "t": "What it means"}, {"k": "c", "c": ["Deficit", "Taking in less energy than you use usually leads to weight loss."]}, {"k": "c", "c": ["Maintenance", "Taking in roughly what you use tends to keep weight broadly stable, despite daily fluctuations."]}, {"k": "c", "c": ["Surplus", "Taking in more energy than you use usually leads to weight gain. Extra food alone does not become extra muscle."]}, {"k": "t", "t": "Estimates are starting points. Energy needs vary, food records have errors and requirements can change. Weight change also includes water and other tissues, so short-term scale changes do not measure fat change precisely."}, {"k": "f", "id": "p20_reflection_116", "l": "If I have a weight-related goal, why does it matter to me?", "ty": "text"}, {"k": "f", "id": "p20_reflection_117", "l": "What would tell me I am supporting my life while pursuing it?", "ty": "text"}, {"k": "t", "t": "Weight loss is not needed to use the body-check or reflection chapters. Muscle, energy, comfort, food enjoyment and everyday function can matter regardless of weight change."}]}, {"number": 21, "title": "Estimate energy needs", "items": [{"k": "h", "t": "1 / Estimate resting energy"}, {"k": "t", "t": "The Mifflin-St Jeor equation uses weight in kilograms, height in centimetres and age in years. It estimates resting energy; this is not a daily food target."}, {"k": "t", "t": "(10 × kg) + (6.25 × cm) − (5 × age) Then -161 for the original female equation, or +5 for the original male equation."}, {"k": "t", "t": "Example: 75 kg, 170 cm, age 40."}, {"k": "t", "t": "(10 × 75) + (6.25 × 170) - (5 × 40) = 1,612.5."}, {"k": "t", "t": "Female equation: 1,451.5 kcal/day. Male equation: 1,617.5 kcal/day."}, {"k": "h", "t": "2 / Include the whole day"}, {"k": "c", "c": ["Rough factor", "Usual activity"]}, {"k": "c", "c": ["1.4", "Mostly sitting, with little daily movement."]}, {"k": "c", "c": ["1.6", "Mostly sitting, plus regular moderate activity."]}, {"k": "c", "c": ["1.8-2.0", "More movement through the day and/or substantial training."]}, {"k": "t", "t": "Example: 1,451.5 × 1.4 = 2,032.1, rounded to about 2,000 kcal/day."}, {"k": "f", "id": "p21_inline_118", "l": "My resting estimate: ______ × factor: ______ = ______ kcal/day.", "ty": "text"}, {"k": "t", "t": "Developed in adults aged 19-78; the original sex categories do not describe gender identity. The factors are simplified and can be inaccurate for an individual. For circumstances outside its scope, including hormone treatment, seek tailored advice. Unit help: pounds ÷ 2.2046 = kg; inches × 2.54 = cm."}, {"k": "t", "t": "Do it / NIDDK Body Weight Planner Choose units and enter your starting details, activity and any appropriate weight goal and date. Review the estimates; goal and maintenance figures mean different things. www.niddk.nih.gov/bwp"}, {"k": "t", "t": "For adults aged 18+; not for pregnancy or breastfeeding. A result is not a prescription. Read Choose your approach · p. 19 for other reasons to seek individual advice first."}]}, {"number": 22, "title": "Understand an adjustment", "items": [{"k": "t", "t": "For adults for whom fat loss is appropriate, a modest adjustment may be more manageable than a large cut. A practical starting example is 10-20% below an estimated maintenance level, often towards 10-15% first. Review wellbeing and a longer-term pattern before changing it."}, {"k": "c", "c": ["Example goal", "At 2,000 kcal maintenance"]}, {"k": "c", "c": ["10-20% deficit", "1,600-1,800 kcal/day"]}, {"k": "c", "c": ["Maintenance", "About 2,000 kcal/day"]}, {"k": "c", "c": ["5-10% surplus", "2,100-2,200 kcal/day"]}, {"k": "t", "t": "A surplus is sometimes used alongside resistance training for muscle gain; it is not a recommendation that everyone should eat more. This workbook does not prescribe a training programme."}, {"k": "t", "t": "Arithmetic: a 15% deficit uses maintenance × 0.85: 2,000 × 0.85 = 1,700. Maintenance uses 1.00; a 5% surplus uses 1.05."}, {"k": "f", "id": "p22_inline_121", "l": "If appropriate for me: my estimate ______ × multiplier ______ = ______.", "ty": "text"}, {"k": "f", "id": "p22_reflection_125", "l": "How will I check energy, hunger, concentration and everyday capability?", "ty": "text"}]}, {"number": 23, "title": "Protein", "items": [{"k": "t", "t": "Protein supplies building blocks for body tissues. Adequate protein and appropriate resistance training can help preserve muscle during weight loss. Protein does not replace enough food overall, and powders are optional."}, {"k": "c", "c": ["Context", "Daily guide"]}, {"k": "c", "c": ["Basic adult reference", "0.83 g per kg body weight"]}, {"k": "c", "c": ["Healthy older adults, usually 65+", "1.0-1.2 g/kg"]}, {"k": "c", "c": ["Healthy adults exercising regularly", "1.4-2.0 g/kg"]}, {"k": "t", "t": "These describe different contexts; do not add them together. A higher-end figure sometimes used with resistance training is 1 g per pound, about 2.2 g/kg. It is not a minimum everyone needs. Many people do well with less."}, {"k": "t", "t": "Example: 75 kg × 1.6 = 120 g/day. At 2.2 g/kg, the same weight gives 165 g/day. Count protein from all foods, and keep fruit, vegetables, fibre, carbohydrates and suitable fats in the picture."}, {"k": "f", "id": "p23_reflection_126", "l": "Protein foods I enjoy and can obtain:", "ty": "text"}, {"k": "f", "id": "p23_inline_127", "l": "Optional calculation, if suitable: ______ kg × ______ g/kg = ______ g/day.", "ty": "text"}, {"k": "t", "t": "With kidney disease, frailty or very high or low body weight, ask for help choosing a target. Sources: EFSA adult reference; PROT-AGE older-adult guidance; ISSN position stand; Morton and colleagues."}, {"k": "t", "t": "PROTEIN USES MORE ENERGY DURING PROCESSING"}, {"k": "c", "c": ["Protein: 20–30%", "Carbohydrate: 5–10%", "Fat: 0–3%"]}, {"k": "t", "t": "Approximate energy used processing each nutrient. Log full food calories; do not subtract a discount."}]}, {"number": 24, "title": "Food logging", "items": [{"k": "t", "t": "Use a food record only if it answers a useful question. Words about meals and appetite are an alternative to numbers."}, {"k": "t", "t": "1 Choose the portion Check the food or package and the portion you ate. Match raw weights with raw-food entries and cooked weights with cooked entries."}, {"k": "t", "t": "2 Record it In MyFitnessPal, use Log / Food, the plus button or Add Food. Search the food or brand, check the entry and set the portion. Include relevant drinks, oils and sauces."}, {"k": "t", "t": "3 Read what you recorded Look for the daily food-energy total and protein in grams. Menus and access can vary. A food log records intake; an app target is a separate estimate."}, {"k": "t", "t": "Without an app: protein per 100 g × portion in grams ÷ 100 = protein in that portion. For example, 8 g per 100 g × 150 g ÷ 100 = 12 g. The same calculation works for kcal. Use an entry that matches preparation."}, {"k": "t", "t": "Do it / MyFitnessPal food logging help Official setup steps. Food logging is available without Premium; other features and access may differ. support.myfitnesspal.com · Food logging help"}, {"k": "f", "id": "p24_reflection_131", "l": "What did the record help me notice?", "ty": "text"}, {"k": "t", "t": "Understand it: Food & body care · p. 14 and Protein · p. 23. If logging increases anxiety, guilt, meal skipping or rigid rules, pause and seek suitable support."}]}, {"number": 25, "title": "Read a food label", "items": [{"k": "t", "t": "A per-100 g label helps compare products at the same weight. A per-serving label helps describe the portion you actually eat. Check both. A lower calorie value is not automatically the better choice for your needs."}, {"k": "c", "c": ["Example products", "Per 100 g: kcal / protein"]}, {"k": "c", "c": ["Brennans Be Good Wholemeal / Family Pan", "212 / 9.4 g • 248 / 10.4 g"]}, {"k": "t", "t": "Arla Skyr Natural / Glenisk Organic Greek Style Natural yoghurt"}, {"k": "t", "t": "61 / 10 g • 121 / 2.8 g"}, {"k": "t", "t": "Tesco Roast Chicken Breast Pieces / Tesco Breaded Chicken Goujons"}, {"k": "t", "t": "115 / 23.8 g • 255 / 13.1 g"}, {"k": "c", "c": ["Flora Lighter / Lurpak Slightly Salted Butter", "252 kcal • 739 kcal"]}, {"k": "t", "t": "Illustrative portions: two bread slices may be 120 versus 198 kcal, but these portions weigh about 57.2 g versus 80 g. At 200 g, the yoghurts are 122 kcal / 20 g protein versus 242 kcal / 5.6 g. At 150 g, the chicken examples are about 173 kcal / 35.7 g versus 383 kcal / 19.7 g. At 10 g, the spreads are about 25 versus 74 kcal."}, {"k": "t", "t": "These are examples from product labels in the source material, not a ranking or current-price comparison. Recipes and labels can change. Chicken product identities and retailer links appear in Sources. Use your own pack for a purchase or food log."}, {"k": "t", "t": "The combined illustration: choosing all four lower-calorie portions changes their total by about 460 kcal. This is not a full-day menu, a recommendation to swap all four, or a prediction of weight change."}, {"k": "f", "id": "p25_reflection_132", "l": "Two foods I buy: what differs per portion and what matters to me?", "ty": "text"}, {"k": "f", "id": "p25_reflection_133", "l": "Which differences matter for my taste, needs, budget and goal?", "ty": "text"}]}, {"number": 26, "title": "What the scales can tell me", "items": [{"k": "t", "t": "Body weight includes fat, muscle, water, bones, organs and the contents of your digestive system. A change on the scales cannot tell you which part changed. Salt, stored carbohydrate, menstrual-cycle changes, meals, drinks and the timing of a reading can affect the number."}, {"k": "t", "t": "500 ml of water weighs about 0.5 kg That is the weight of the water, not body fat. Keep drinking normally. A weigh-in is never a reason to restrict fluids."}, {"k": "t", "t": "Home body-fat scales estimate body composition. Do not treat a daily “fat gained” or “muscle lost” message as a precise finding. Scale weight also cannot tell you how strong, fit or healthy you are."}, {"k": "h", "t": "When it helps"}, {"k": "h", "t": "When it takes over"}, {"k": "t", "t": "It answers a useful question about a longer-term trend without deciding the rest of your day."}, {"k": "t", "t": "You repeatedly check, feel judged by the reading, skip food or change your day to compensate."}, {"k": "f", "id": "p26_reflection_134", "l": "What would I want weighing to help me understand?", "ty": "text"}, {"k": "f", "id": "p26_reflection_135", "l": "My choice: use the scales / take a break / no home weighing. Why?", "ty": "text"}, {"k": "t", "t": "Follow an existing healthcare monitoring plan. For under-18s, pregnancy or an eating-disorder history, seek individual advice rather than planning weight change alone."}]}, {"number": 27, "title": "Record a useful trend", "items": [{"k": "t", "t": "Use the same scales on a firm, level floor, at a similar time and in similar clothing. Morning after the toilet and before breakfast is one practical option. Ask for an accessible alternative if standing is difficult."}, {"k": "t", "t": "Weekly is a simple choice. Daily readings are optional if they feel neutral and you use an average; less often or no weighing is fine. Do not weigh more than once a day unless your care team advises it. Keep food and fluids normal."}, {"k": "c", "c": ["Date", "Weight / unit", "Useful context"]}, {"k": "f", "id": "p27_table_136", "l": "Date / row 1", "ty": "text"}, {"k": "f", "id": "p27_table_137", "l": "Weight / unit / row 1", "ty": "text"}, {"k": "f", "id": "p27_table_138", "l": "Useful context / row 1", "ty": "text"}, {"k": "f", "id": "p27_table_139", "l": "Date / row 2", "ty": "text"}, {"k": "f", "id": "p27_table_140", "l": "Weight / unit / row 2", "ty": "text"}, {"k": "f", "id": "p27_table_141", "l": "Useful context / row 2", "ty": "text"}, {"k": "f", "id": "p27_table_142", "l": "Date / row 3", "ty": "text"}, {"k": "f", "id": "p27_table_143", "l": "Weight / unit / row 3", "ty": "text"}, {"k": "f", "id": "p27_table_144", "l": "Useful context / row 3", "ty": "text"}, {"k": "f", "id": "p27_table_145", "l": "Date / row 4", "ty": "text"}, {"k": "f", "id": "p27_table_146", "l": "Weight / unit / row 4", "ty": "text"}, {"k": "f", "id": "p27_table_147", "l": "Useful context / row 4", "ty": "text"}, {"k": "f", "id": "p27_table_148", "l": "Date / row 5", "ty": "text"}, {"k": "f", "id": "p27_table_149", "l": "Weight / unit / row 5", "ty": "text"}, {"k": "f", "id": "p27_table_150", "l": "Useful context / row 5", "ty": "text"}, {"k": "h", "t": "If using several readings"}, {"k": "t", "t": "Add them, then divide by how many you recorded. Example: 75.0 + 75.4 + 74.8 + 75.2 = 300.4 kg. Divide by 4 = 75.1 kg. A later set of 74.9, 74.5, 74.8 and 75.4 averages 74.9 kg: the final reading rose, but the average fell."}, {"k": "t", "t": "These are example numbers, not target weights. Keep units, timing and frequency similar when comparing averages. Include higher readings too. Look across several weeks; even a trend does not precisely measure fat change."}, {"k": "f", "id": "p27_reflection_151", "l": "My next step: keep / adjust / pause tracking / seek support. Because…", "ty": "text"}]}, {"number": 28, "title": "Food: my next step", "items": [{"k": "f", "id": "p28_reflection_152", "l": "What have I learnt about food, my body or my circumstances?", "ty": "text"}, {"k": "t", "t": "With or without measurements"}, {"k": "t", "t": "What matters to me"}, {"k": "c", "c": ["Everyday life", "Energy, concentration, comfortable clothes, easier tasks or recovery."]}, {"k": "c", "c": ["Food experience", "More satisfying meals, variety, enjoyment or less pressure."]}, {"k": "c", "c": ["Practical care", "A workable shopping routine, enough food or useful support."]}, {"k": "h", "t": "MY NEXT STEP"}, {"k": "f", "id": "p28_inline_153", "l": "Does my original goal still fit? __________", "ty": "text"}, {"k": "f", "id": "p28_inline_154", "l": "What did I learn about my actual needs and resources? __________", "ty": "text"}, {"k": "f", "id": "p28_inline_155", "l": "Which option supports me without adding unnecessary pressure? __________", "ty": "text"}, {"k": "f", "id": "p28_inline_156", "l": "I will try __________. My smaller version is __________.", "ty": "text"}]}, {"number": 29, "title": "Screen time & attention", "items": [{"k": "f", "id": "p29_chapter_focus_158", "l": "What do I want more attention or time for?", "ty": "text"}, {"k": "t", "t": "A total number of hours cannot tell you the whole story. Look at what you do, when you do it, how it leaves you feeling and what it may replace: sleep, movement, concentration or being with someone."}, {"k": "t", "t": "Ask about the experience as well as the hours. After using this app, do I feel connected, informed, rested, distracted, tense or something else?"}, {"k": "t", "t": "In a 2025 randomised trial, blocking mobile internet on phones for two weeks improved measured attention, wellbeing and mental-health outcomes. Calls, texts and internet on other devices remained available. This was a specific intervention, with adherence limits; it does not establish a universal daily screen-time limit or prove that a particular device will help you."}, {"k": "f", "id": "p29_reflection_159", "l": "When I reach for my phone without planning to, what am I looking for?", "ty": "text"}, {"k": "f", "id": "p29_reflection_160", "l": "What would I like to give ten reclaimed minutes to?", "ty": "text"}, {"k": "t", "t": "Research: Castelo and colleagues (2025), PNAS Nexus. A personal experiment can reveal a pattern; it cannot establish the cause of a mental-health difficulty."}]}, {"number": 30, "title": "Protect my attention", "items": [{"k": "c", "c": ["Free options first", "What I could try"]}, {"k": "c", "c": ["Reduce prompts", "Turn off a few non-essential notifications."]}, {"k": "c", "c": ["Create a place", "Put the phone away during one chosen activity."]}, {"k": "c", "c": ["Use built-in tools", "Try app limits, focus settings or scheduled quiet time."]}, {"k": "c", "c": ["Plan the replacement", "Keep a book, sketchpad, activity or person in mind."]}, {"k": "t", "t": "Optional tool / Brick A physical device and app that block selected apps. Check current phone compatibility and essential-access settings. getbrick.com/"}, {"k": "f", "id": "p30_inline_161", "l": "My experiment: during __________ I will __________.", "ty": "text"}, {"k": "h", "t": "MY NEXT STEP"}, {"k": "f", "id": "p30_inline_164", "l": "Did this make room for something that matters? __________", "ty": "text"}, {"k": "f", "id": "p30_inline_165", "l": "What happened to my attention or mood? What else was happening? __________", "ty": "text"}, {"k": "f", "id": "p30_inline_166", "l": "Which free or paid option fits my actual circumstances? __________", "ty": "text"}, {"k": "f", "id": "p30_inline_167", "l": "I will keep/change __________ and carry it into __________.", "ty": "text"}, {"k": "h", "t": "What would a great leader do?"}, {"k": "t", "t": "How would they protect attention while staying available for what matters?"}]}, {"number": 31, "title": "Meditation", "items": [{"k": "f", "id": "p31_chapter_focus_169", "l": "What would I like from a short pause?", "ty": "text"}, {"k": "t", "t": "Meditation includes practices that train attention or awareness. Mindfulness-based approaches may help some people with stress and other symptoms, but results vary and research has limitations. You do not have to feel calm afterwards for your observation to be useful."}, {"k": "h", "t": "A simple one-minute experiment"}, {"k": "t", "t": "1. Sit or stand comfortably. Your eyes can stay open."}, {"k": "t", "t": "2. Choose an anchor: a sound, your feet on the floor or your natural breathing."}, {"k": "t", "t": "3. Notice when attention wanders. Gently return."}, {"k": "t", "t": "4. Finish by looking around and noticing how you feel."}, {"k": "f", "id": "p31_inline_170", "l": "Before the pause I noticed __________. Afterwards __________.", "ty": "text"}, {"k": "t", "t": "If inward attention feels distressing, stop and reconnect with the room or choose another activity. Meditation does not replace needed healthcare. Source: NCCIH; this short activity is an original suggestion, not a validated treatment."}]}, {"number": 32, "title": "A guided pause", "items": [{"k": "t", "t": "davidji / five-minute guided meditation Open the practice on davidji's own website. Notice your own response; there is no need to make yourself feel calm. davidji.com/erase-anxiety-5min-gm/"}, {"k": "t", "t": "Choose a safe moment to listen. Keep your eyes open if that feels better; stop if the practice increases distress."}, {"k": "f", "id": "p32_reflection_173", "l": "What did I like or dislike about being guided?", "ty": "text"}, {"k": "f", "id": "p32_reflection_174", "l": "Was I trying to achieve a particular feeling? What happened when I noticed that?", "ty": "text"}, {"k": "f", "id": "p32_reflection_175", "l": "What would make a pause easier to include in my real day?", "ty": "text"}, {"k": "h", "t": "MY NEXT STEP"}, {"k": "f", "id": "p32_inline_176", "l": "Does this kind of pause support my goal? __________", "ty": "text"}, {"k": "f", "id": "p32_inline_177", "l": "What did I notice, including discomfort or no change? __________", "ty": "text"}, {"k": "f", "id": "p32_inline_178", "l": "Try again, shorten it, use another anchor or skip it? __________", "ty": "text"}, {"k": "f", "id": "p32_inline_179", "l": "My next choice is __________. I can stop whenever I need.", "ty": "text"}]}, {"number": 33, "title": "Wheel of Life & GROW", "items": [{"k": "t", "t": "Use this chapter when you want to explore your life-area snapshot or turn an intention into a realistic step. You can use the everyday pages without it."}, {"k": "c", "c": ["Meaning", "A question to begin"]}, {"k": "c", "c": ["G", "Goal", "What do I want to understand or change?"]}, {"k": "c", "c": ["R", "Reality", "What is happening now, including my feelings, resources and limits?"]}, {"k": "c", "c": ["O", "Options", "What could I try, adapt, ask for or leave alone?"]}, {"k": "c", "c": ["W", "Will / way forward", "What am I willing to do, when, and with what support?"]}, {"k": "t", "t": "On the next page, transfer your scores from Your life right now (p. 3) if they still fit. Or score afresh and add a new date. The diagram is another way to see the same snapshot."}, {"k": "f", "id": "p33_reflection_180", "l": "The change or question bringing me here:", "ty": "text"}, {"k": "t", "t": "GROW: Sir John Whitmore and colleagues. These explanations and questions are original adaptations. The Wheel of Life is a separate reflection tool."}]}, {"number": 34, "title": "My Wheel of Life", "items": [{"k": "t", "t": "Score each area from 0 to 10: 0 = not working for me; 10 = working very well. Mark each spoke and join the points. Rename any area that does not fit."}, {"k": "t", "t": "Rest & energy"}, {"k": "t", "t": "10"}, {"k": "t", "t": "Meaning & self"}, {"k": "t", "t": "Food & body care"}, {"k": "t", "t": "8"}, {"k": "t", "t": "6"}, {"k": "t", "t": "4"}, {"k": "t", "t": "2"}, {"k": "t", "t": "Play & creativity"}, {"k": "t", "t": "Movement"}, {"k": "t", "t": "0"}, {"k": "t", "t": "Home & support"}, {"k": "t", "t": "Relationships"}, {"k": "t", "t": "Work & money"}, {"k": "f", "id": "p34_inline_181", "l": "Date: __________ The area I choose to focus on - and why:", "ty": "text"}, {"k": "t", "t": "The scores are personal judgements, not a test. The lowest score need not come first, and a balanced life need not form a perfect circle."}]}, {"number": 35, "title": "Behind the scores", "items": [{"k": "c", "c": ["Area", "A useful question", "A few words"]}, {"k": "f", "id": "p35_table_183", "l": "A few words / Rest + energy / row 1", "ty": "text"}, {"k": "c", "c": ["Rest + energy", "Where do I recover? What keeps using energy after I have run out?"]}, {"k": "f", "id": "p35_table_184", "l": "A few words / Food + body care / row 2", "ty": "text"}, {"k": "c", "c": ["Food + body care", "Do my everyday choices support me? What feels caring or pressured?"]}, {"k": "f", "id": "p35_table_185", "l": "A few words / Movement + strength / row 3", "ty": "text"}, {"k": "t", "t": "What would I like to do more comfortably or confidently?"}, {"k": "f", "id": "p35_table_186", "l": "A few words / Relationships / row 4", "ty": "text"}, {"k": "c", "c": ["Relationships", "Where can I be myself? Where do I feel connected or alone?"]}, {"k": "f", "id": "p35_table_187", "l": "A few words / Work + money / row 5", "ty": "text"}, {"k": "c", "c": ["Work + money", "What matters about this area beyond other people's idea of success?"]}, {"k": "f", "id": "p35_table_188", "l": "A few words / Home + support / row 6", "ty": "text"}, {"k": "c", "c": ["Home + support", "What makes daily life easier? What practical support is missing?"]}, {"k": "f", "id": "p35_table_189", "l": "A few words / Play + creativity / row 7", "ty": "text"}, {"k": "c", "c": ["Play + creativity", "What do I enjoy without needing to be productive or impressive?"]}, {"k": "f", "id": "p35_table_190", "l": "A few words / Meaning + self / row 8", "ty": "text"}, {"k": "c", "c": ["Meaning + self", "Which parts of life feel chosen? Which feel inherited or expected?"]}, {"k": "f", "id": "p35_reflection_191", "l": "Which strength elsewhere in my life could help this area?", "ty": "text"}, {"k": "t", "t": "Rename categories freely: parenting, faith, friendships, caring, study, community, access or something else. An overlapping area is useful if it helps you see your own life."}]}, {"number": 36, "title": "My first GROW", "items": [{"k": "f", "id": "p36_reflection_192", "l": "G / The everyday change I want, and why it matters:", "ty": "text"}, {"k": "f", "id": "p36_reflection_193", "l": "R / My current pattern, resources and limits:", "ty": "text"}, {"k": "f", "id": "p36_reflection_194", "l": "O / Three possibilities, including a smaller or supported version:", "ty": "text"}, {"k": "f", "id": "p36_inline_195", "l": "W / I will try __________ when __________.", "ty": "text"}, {"k": "f", "id": "p36_inline_198", "l": "If this gets in the way: __________ I will: __________", "ty": "text"}, {"k": "f", "id": "p36_inline_200", "l": "Support: __________ Willingness: ____ / 10", "ty": "text"}, {"k": "f", "id": "p36_inline_202", "l": "Review point: __________", "ty": "text"}, {"k": "t", "t": "Example: protect ten minutes after dinner for a short walk or quiet pause; ask someone to share one evening task. Keep a step that suits your circumstances."}]}, {"number": 37, "title": "Fitness checks", "items": [{"k": "t", "t": "These checks record how a task goes on a particular day. Choose one or two relevant to your life. Established tests and workbook adaptations are labelled; they are not a diagnosis or an exercise programme."}, {"k": "c", "c": ["Everyday question", "Possible check"]}, {"k": "c", "c": ["Getting up from a chair", "Chair stand"]}, {"k": "c", "c": ["Steadiness / getting around", "Balance / Timed Up and Go"]}, {"k": "c", "c": ["Stamina", "Walking / seated marching"]}, {"k": "c", "c": ["Pushing / calf use / trunk support", "Wall or counter task / calf raise"]}, {"k": "f", "id": "p37_reflection_203", "l": "My goal: what would I like my body to do more comfortably or confidently?", "ty": "text"}, {"k": "f", "id": "p37_reflection_204", "l": "The checks I choose, and any support I need:", "ty": "text"}]}, {"number": 38, "title": "Before a body check", "items": [{"k": "t", "t": "Use stable equipment, a clear non-slip space, suitable footwear and any usual walking aid. Have a helper where the method asks for one. Warm up briefly with comfortable familiar movement; rest between checks until recovered. Avoid testing when unwell or unusually fatigued."}, {"k": "t", "t": "Stop rather than push through Stop for pain, dizziness, loss of control or feeling unwell. Chest pain, fainting, severe unusual breathlessness or new weakness need urgent medical help. In Ireland, call 112 or 999; elsewhere use your local emergency number."}, {"k": "t", "t": "Get individual advice first after recent surgery or injury, unexplained fainting, repeated falls, or with a condition that affects safe activity. If balance is uncertain, work with a qualified professional. Never arrange an unsupported challenge simply to obtain a score."}, {"k": "h", "t": "Make a later comparison fair"}, {"k": "t", "t": "Use the same chair height, route, surface, support, footwear, timing and movement rules. Record the version. A supported version can be useful, but its result belongs in a separate record. Rest, symptoms, practice and encouragement can all affect a result."}, {"k": "f", "id": "p38_reflection_205", "l": "My space, equipment, helper and any advice I need:", "ty": "text"}, {"k": "f", "id": "p38_reflection_206", "l": "What I will keep the same when I return:", "ty": "text"}, {"k": "t", "t": "Effort scale used here: 0 = resting; 10 = maximum effort. It describes your experience, not a target to reach. These adult reference tables do not apply to children."}]}, {"number": 39, "title": "The 30-second chair stand", "items": [{"k": "t", "t": "You need: a firm armless chair against a wall, a timer and a helper to count. The standard setup uses a seat about 43 cm / 17 inches high. Measure and record the height."}, {"k": "t", "t": "1. Sit in the middle of the seat, feet flat, back upright. Cross your wrists and place your"}, {"k": "t", "t": "hands on opposite shoulders, arms against your chest."}, {"k": "t", "t": "2. On “Go”, stand fully, then sit back down under control. Continue for 30 seconds."}, {"k": "t", "t": "3. Count full stands. Count the final rise if you are more than halfway up when time ends."}, {"k": "t", "t": "Practise two rises, then rest at least a minute and until recovered before one recorded attempt. Stop if control is lost or symptoms appear. Keep the practice and rest routine the same next time."}, {"k": "t", "t": "If you need your hands Stop the standard test and record 0 under that test’s scoring rule. After resting, an assisted version may use a firm armchair or fixed support. Record that support and keep the assisted result separate."}, {"k": "t", "t": "Optional demonstration / CDC chair-stand test youtu.be/qkV0UvjXgcs"}, {"k": "c", "c": ["Date / setup", "Result / version", "Comfort / effort / context"]}, {"k": "f", "id": "p39_table_207", "l": "Date / setup / row 1", "ty": "text"}, {"k": "f", "id": "p39_table_208", "l": "Result / version / row 1", "ty": "text"}, {"k": "f", "id": "p39_table_209", "l": "Comfort / effort / context / row 1", "ty": "text"}, {"k": "f", "id": "p39_inline_210", "l": "Chair height ______ cm. Rises ______. Effort 0-10 ______. What did I notice?", "ty": "text"}]}, {"number": 40, "title": "Chair-stand reference ranges", "items": [{"k": "t", "t": "Ages 60-94: middle 50% of scores in the US Senior Fitness Test reference population. Use the standard no-hands chair-rise setup."}, {"k": "c", "c": ["Age", "Men", "Women"]}, {"k": "c", "c": ["60-64", "14-19", "12-17"]}, {"k": "c", "c": ["65-69", "12-18", "11-16"]}, {"k": "c", "c": ["70-74", "12-17", "10-15"]}, {"k": "c", "c": ["75-79", "11-17", "10-15"]}, {"k": "c", "c": ["80-84", "10-15", "9-14"]}, {"k": "c", "c": ["85-89", "8-14", "8-13"]}, {"k": "c", "c": ["90-94", "7-12", "4-11"]}, {"k": "t", "t": "Ages 20-59: rounded mean scores from independently living, apparently healthy Danish adults in the Copenhagen Sarcopenia Study. This used a 45 cm chair and counted fully completed stands: background context, not direct grades for the 43 cm check."}, {"k": "c", "c": ["Age", "Men", "Women"]}, {"k": "c", "c": ["20-29", "26", "27"]}, {"k": "c", "c": ["30-39", "28", "27"]}, {"k": "c", "c": ["40-49", "26", "25"]}, {"k": "c", "c": ["50-59", "23", "22"]}, {"k": "t", "t": "These are the categories reported in the original studies. Health, body size, setup and practice affect comparison. The most useful personal comparison is often you with the same setup. A persistent decline or new difficulty deserves a clinical conversation. Sources: Jones & Rikli (2002); Suetta and colleagues (2019)."}]}, {"number": 41, "title": "Standing balance", "items": [{"k": "t", "t": "Setup: firm floor, fixed support within reach and someone able to guard you safely. If you are unsteady or have fallen, do this with a qualified professional. Use support to settle into a position; release it only when steady and start the timer."}, {"k": "t", "t": "Keep eyes open; arms may move. Stop timing at 10 seconds, if a foot moves, if the lifted foot touches down, or if you need support. Progress only after completing 10 seconds. Leave untried positions blank."}, {"k": "f", "id": "p41_inline_214", "l": "First date ____", "ty": "text"}, {"k": "f", "id": "p41_inline_215", "l": "Later date ____", "ty": "text"}, {"k": "c", "c": ["Position", "First date ____", "Later date ____"]}, {"k": "c", "c": ["Feet together: side by side.", "____ seconds", "____ seconds"]}, {"k": "f", "id": "p41_inline_216", "l": "____ seconds", "ty": "text"}, {"k": "t", "t": "One foot slightly forward: instep touches the other big toe."}, {"k": "c", "c": ["____ seconds", "____ seconds"]}, {"k": "t", "t": "Heel to toe: heel directly in front of and touching the other toes."}, {"k": "c", "c": ["____ seconds", "____ seconds"]}, {"k": "c", "c": ["One foot: lift the other foot clear of the floor.", "____ seconds", "____ seconds"]}, {"k": "t", "t": "Supported option: keep your hands on a fixed counter and hold a comfortable stance for up to 10 seconds. Record it as a separate observation, with the support described."}, {"k": "t", "t": "Optional demonstration / CDC four-stage balance test youtu.be/VUq6IgQAVJM"}, {"k": "f", "id": "p41_reflection_224", "l": "Which foot was forward / on the floor? What support or difficulty did I notice?", "ty": "text"}, {"k": "t", "t": "Ten seconds is the limit of this test, not a complete measure of balance or a guarantee against falling. Source: CDC STEADI."}]}, {"number": 42, "title": "Timed Up and Go", "items": [{"k": "t", "t": "Three metres. no rush. Mark a line 3 metres from the front of a firm armchair, on a clear, level route."}, {"k": "t", "t": "You need: a timer, a helper, your usual footwear and walking aid. The helper explains the"}, {"k": "t", "t": "route and stays nearby."}, {"k": "t", "t": "1. Start seated, back against the chair."}, {"k": "t", "t": "2. On “Go”, stand, walk to the line, turn, walk back and sit down."}, {"k": "t", "t": "3. Time from “Go” until seated again. Use your normal pace throughout."}, {"k": "t", "t": "Practise once, rest until recovered, then record one timed attempt. Use the same practice routine next time. Record the chair height, turn direction, walking aid and whether you used your arms."}, {"k": "t", "t": "Optional demonstration / CDC Timed Up and Go youtu.be/tNay64Mab78"}, {"k": "c", "c": ["Date / setup", "Result / version", "Comfort / effort / context"]}, {"k": "f", "id": "p42_table_225", "l": "Date / setup / row 1", "ty": "text"}, {"k": "f", "id": "p42_table_226", "l": "Result / version / row 1", "ty": "text"}, {"k": "f", "id": "p42_table_227", "l": "Comfort / effort / context / row 1", "ty": "text"}, {"k": "f", "id": "p42_inline_228", "l": "Time ______ seconds. Chair height ______ cm. Did I feel steady?", "ty": "text"}, {"k": "f", "id": "p42_reflection_231", "l": "What did I notice about standing, walking or turning?", "ty": "text"}, {"k": "t", "t": "Keep the same setup. A faster result achieved by rushing is a different performance. If standing or walking is unsuitable, use a separate seated observation. A time alone cannot diagnose a mobility problem. Source: CDC STEADI."}]}, {"number": 43, "title": "Comfortable walking", "items": [{"k": "t", "t": "You need: a safe, level route with a known length, a timer, usual footwear and aid, and a helper if needed. Choose a duration that is already appropriate for you. Keep it the same for comparison."}, {"k": "t", "t": "1. Begin at a comfortable, purposeful pace at which you can speak in sentences."}, {"k": "t", "t": "2. Walk for the chosen time. If you rest, keep the clock running and note the rest."}, {"k": "t", "t": "3. Count completed lengths and measure the final part. Record distance, effort and"}, {"k": "t", "t": "symptoms."}, {"k": "t", "t": "Example: 12 lengths of a 20-metre route, plus 8 metres, gives (12 × 20) + 8 = 248 metres. A route with frequent turns differs from a longer straight route."}, {"k": "t", "t": "Optional demonstration / Talk-test / pace guide - movement guidance, not this exact check youtu.be/5dt-SRPbElI"}, {"k": "c", "c": ["Date", "Duration / route", "Distance / rests / effort"]}, {"k": "f", "id": "p43_table_232", "l": "Date / row 1", "ty": "text"}, {"k": "f", "id": "p43_table_233", "l": "Duration / route / row 1", "ty": "text"}, {"k": "f", "id": "p43_table_234", "l": "Distance / rests / effort / row 1", "ty": "text"}, {"k": "f", "id": "p43_table_235", "l": "Date / row 2", "ty": "text"}, {"k": "f", "id": "p43_table_236", "l": "Duration / route / row 2", "ty": "text"}, {"k": "f", "id": "p43_table_237", "l": "Distance / rests / effort / row 2", "ty": "text"}, {"k": "f", "id": "p43_reflection_238", "l": "What did I notice during the task and as I recovered?", "ty": "text"}, {"k": "t", "t": "Do not aim for maximum effort. Use the stop guidance at the start of this chapter. This adapted check has no diagnostic cut-off or universal target distance."}]}, {"number": 44, "title": "Seated marching", "items": [{"k": "t", "t": "Use a stable chair, feet on the floor and enough space. Choose 2 minutes, or a shorter duration in advance if that is more appropriate. A seated task is not automatically suitable for every condition; use individual advice when needed."}, {"k": "t", "t": "1. Sit upright with support as needed. Practise a few comfortable alternating knee lifts."}, {"k": "t", "t": "2. Start the timer and march at an easy, sustainable rhythm. Use a comfortable repeatable"}, {"k": "t", "t": "knee height."}, {"k": "t", "t": "3. Count each lift of the right knee. Keep the timer running during rests. Stop for symptoms"}, {"k": "t", "t": "or loss of comfortable control."}, {"k": "t", "t": "Record the chair, support, duration, knee height, count, rests and effort. If you change the height or duration, label it as a new version. Do not compare the count with walking distance."}, {"k": "t", "t": "Optional demonstration / Seated marching movement youtu.be/D_AEO1YriE4"}, {"k": "c", "c": ["Date / setup", "Result / version", "Comfort / effort / context"]}, {"k": "f", "id": "p44_table_239", "l": "Date / setup / row 1", "ty": "text"}, {"k": "f", "id": "p44_table_240", "l": "Result / version / row 1", "ty": "text"}, {"k": "f", "id": "p44_table_241", "l": "Comfort / effort / context / row 1", "ty": "text"}, {"k": "f", "id": "p44_inline_242", "l": "Duration ______. Right-knee lifts ______. Effort 0-10 ______.", "ty": "text"}, {"k": "f", "id": "p44_reflection_246", "l": "What made this comfortable or difficult today?", "ty": "text"}, {"k": "t", "t": "This is a workbook observation, not a standardised fitness diagnosis. The demonstration shows the movement; use the timing and recording rules on this page."}]}, {"number": 45, "title": "Wall or counter press", "items": [{"k": "t", "t": "Use a clear, non-slip space and a wall or fixed counter that will not move. Begin with the easier wall angle. Record the surface height, distance of feet from it and hand spacing."}, {"k": "t", "t": "1. Place hands around shoulder width, body in a comfortable straight line. Keep feet secure."}, {"k": "t", "t": "2. Bend your elbows to lower under control for about 2 seconds, then press back over about"}, {"k": "t", "t": "1 second. Breathe normally."}, {"k": "t", "t": "3. Count controlled repetitions, up to a maximum of 20. Stop earlier if posture changes,"}, {"k": "t", "t": "control is lost or symptoms appear."}, {"k": "t", "t": "Practise 2-3 repetitions, then rest for at least a minute and until recovered before one recorded attempt. Keep the same depth, surface, pace and setup for a later comparison. If wrists or shoulders hurt, stop and choose another suitable observation with advice if needed."}, {"k": "t", "t": "Optional demonstration / Wall press-up / plank movement youtu.be/KKlB_uiX3Dc"}, {"k": "c", "c": ["Date / setup", "Result / version", "Comfort / effort / context"]}, {"k": "f", "id": "p45_table_247", "l": "Date / setup / row 1", "ty": "text"}, {"k": "f", "id": "p45_table_248", "l": "Result / version / row 1", "ty": "text"}, {"k": "f", "id": "p45_table_249", "l": "Comfort / effort / context / row 1", "ty": "text"}, {"k": "f", "id": "p45_inline_250", "l": "Repetitions ______. Surface / foot distance ______. Effort ______.", "ty": "text"}, {"k": "f", "id": "p45_reflection_254", "l": "What did I learn that matters in ordinary life?", "ty": "text"}, {"k": "t", "t": "This adapted check has no clinical pass mark. Twenty is a ceiling for recording, not a requirement or a training prescription."}]}, {"number": 46, "title": "Calf raises", "items": [{"k": "t", "t": "Stand on a level, non-slip floor beside a fixed support. Use light fingertip contact for balance, rather than pulling yourself up. Keep your chosen footwear the same each time."}, {"k": "t", "t": "1. With both feet on the floor, rise onto the balls of your feet over about 1 second."}, {"k": "t", "t": "2. Lower over about 1 second, keeping the movement controlled."}, {"k": "t", "t": "3. Count repetitions to a maximum of 25. Keep a consistent heel height. Stop if height falls,"}, {"k": "t", "t": "you rely on your arms, control changes or symptoms appear."}, {"k": "t", "t": "Practise 2-3 comfortable raises and rest for at least a minute and until recovered before recording. A seated heel raise is a separate supported option. A single-leg version is optional only if already familiar and suitable for you; record it separately, with at least 2 minutes between sides and longer if not recovered."}, {"k": "t", "t": "Optional demonstration / Calf-raise movement youtu.be/cqDMYUaIXvw"}, {"k": "c", "c": ["Date / setup", "Result / version", "Comfort / effort / context"]}, {"k": "f", "id": "p46_table_255", "l": "Date / setup / row 1", "ty": "text"}, {"k": "f", "id": "p46_table_256", "l": "Result / version / row 1", "ty": "text"}, {"k": "f", "id": "p46_table_257", "l": "Comfort / effort / context / row 1", "ty": "text"}, {"k": "f", "id": "p46_inline_258", "l": "Both legs / one leg? Repetitions ______. Support ______. Effort ______.", "ty": "text"}, {"k": "f", "id": "p46_reflection_262", "l": "How did the movement feel on each side?", "ty": "text"}, {"k": "t", "t": "Do not use a stair edge for this check. The cap of 25 is a recording limit, not a target. A new asymmetry, pain or persistent difficulty can be discussed with a clinician."}]}, {"number": 47, "title": "Direction & response", "items": [{"k": "h", "t": "Side-steps / 30 seconds"}, {"k": "t", "t": "Mark two lines 1 metre apart on a clear, non-slip floor. Practise both directions. On “Go”, side-step from one line to the other without crossing your feet. Count a completed length when both feet cross the destination line. Continue for 30 seconds, stopping for loss of balance, symptoms or control. Record completed lengths and any support."}, {"k": "t", "t": "Optional demonstration / Side-step movement - not the cue task below youtu.be/1QMX5eWWC3Y"}, {"k": "h", "t": "Optional cue task / 10 instructions"}, {"k": "t", "t": "With a helper, mark a target about 30 cm to each side of a centre point. The helper gives 10 “left” or “right” cues, 5 of each, in a newly mixed order, around 4 seconds apart. Step to the named target and return to centre. Record correct responses and balance errors. Stop if unsteady or unable to return before the next cue without rushing. Hearing, understanding and practice can affect this task; it is not a laboratory reaction-time test."}, {"k": "t", "t": "Seated alternative: tap left and right targets on a table to the same cue pattern, using a comfortable reach. Label and compare this separately. Supported side-stepping along a fixed counter can instead be observed without timing speed."}, {"k": "c", "c": ["Task / setup", "First record", "Later record"]}, {"k": "f", "id": "p47_table_263", "l": "First record / Side-steps: lengths / support / row 1", "ty": "text"}, {"k": "f", "id": "p47_table_264", "l": "Later record / Side-steps: lengths / support / row 1", "ty": "text"}, {"k": "f", "id": "p47_table_265", "l": "First record / Cue task: correct / errors / standing or seated / row 2", "ty": "text"}, {"k": "f", "id": "p47_table_266", "l": "Later record / Cue task: correct / errors / standing or seated / row 2", "ty": "text"}, {"k": "f", "id": "p47_reflection_267", "l": "What helped me respond? Did rushing change the task?", "ty": "text"}, {"k": "t", "t": "These are original adapted observations, not validated clinical scores. Leave the standing options out if balance is uncertain."}]}, {"number": 48, "title": "Trunk support", "items": [{"k": "t", "t": "Choose a safe surface and an easy body angle. Place hands on the wall or counter and step back a little, keeping a comfortable straight line through your body. Note surface height, foot position and hand spacing."}, {"k": "t", "t": "1. Try a short practice hold. Rest at least 1 minute and until recovered."}, {"k": "t", "t": "2. Start timing once settled. Breathe normally."}, {"k": "t", "t": "3. Stop at 30 seconds or earlier if posture changes, you hold your breath, wrists become"}, {"k": "t", "t": "uncomfortable, or other symptoms appear."}, {"k": "t", "t": "Record the time and setup. A different angle changes the task. More time is not automatically more useful once you reach the recording cap."}, {"k": "t", "t": "Optional demonstration / Wall plank / press-up movement youtu.be/KKlB_uiX3Dc"}, {"k": "c", "c": ["Date / setup", "Result / version", "Comfort / effort / context"]}, {"k": "f", "id": "p48_table_268", "l": "Date / setup / row 1", "ty": "text"}, {"k": "f", "id": "p48_table_269", "l": "Result / version / row 1", "ty": "text"}, {"k": "f", "id": "p48_table_270", "l": "Comfort / effort / context / row 1", "ty": "text"}, {"k": "f", "id": "p48_inline_271", "l": "Hold ______ seconds. Setup ______. Effort ______.", "ty": "text"}, {"k": "h", "t": "A separate seated observation"}, {"k": "t", "t": "If a wall or counter task is unsuitable, sit in a stable chair and make a small comfortable reach within your base of support. Keep feet supported; stop if unsteady. Describe control and comfort rather than assigning a comparable hold score."}, {"k": "t", "t": "These adapted observations cannot diagnose “core weakness”. Use the result as one clue about the particular task."}]}, {"number": 49, "title": "My fitness comparison", "items": [{"k": "c", "c": ["Check / version", "First result", "Later result", "Setup / effort / notes"]}, {"k": "f", "id": "p49_table_275", "l": "First result / Chair stand + chair height / row 1", "ty": "text"}, {"k": "f", "id": "p49_table_276", "l": "Later result / Chair stand + chair height / row 1", "ty": "text"}, {"k": "f", "id": "p49_table_277", "l": "Setup / effort / notes / Chair stand + chair height / row 1", "ty": "text"}, {"k": "f", "id": "p49_table_278", "l": "First result / Balance / row 2", "ty": "text"}, {"k": "f", "id": "p49_table_279", "l": "Later result / Balance / row 2", "ty": "text"}, {"k": "f", "id": "p49_table_280", "l": "Setup / effort / notes / Balance / row 2", "ty": "text"}, {"k": "f", "id": "p49_table_281", "l": "First result / Timed Up and Go / row 3", "ty": "text"}, {"k": "f", "id": "p49_table_282", "l": "Later result / Timed Up and Go / row 3", "ty": "text"}, {"k": "f", "id": "p49_table_283", "l": "Setup / effort / notes / Timed Up and Go / row 3", "ty": "text"}, {"k": "f", "id": "p49_table_284", "l": "First result / Walking / seated marching / row 4", "ty": "text"}, {"k": "f", "id": "p49_table_285", "l": "Later result / Walking / seated marching / row 4", "ty": "text"}, {"k": "f", "id": "p49_table_286", "l": "Setup / effort / notes / Walking / seated marching / row 4", "ty": "text"}, {"k": "f", "id": "p49_table_287", "l": "First result / Wall / counter press / row 5", "ty": "text"}, {"k": "f", "id": "p49_table_288", "l": "Later result / Wall / counter press / row 5", "ty": "text"}, {"k": "f", "id": "p49_table_289", "l": "Setup / effort / notes / Wall / counter press / row 5", "ty": "text"}, {"k": "f", "id": "p49_table_290", "l": "First result / Calf raise / row 6", "ty": "text"}, {"k": "f", "id": "p49_table_291", "l": "Later result / Calf raise / row 6", "ty": "text"}, {"k": "f", "id": "p49_table_292", "l": "Setup / effort / notes / Calf raise / row 6", "ty": "text"}, {"k": "f", "id": "p49_table_293", "l": "First result / Side-step / cue response / row 7", "ty": "text"}, {"k": "f", "id": "p49_table_294", "l": "Later result / Side-step / cue response / row 7", "ty": "text"}, {"k": "f", "id": "p49_table_295", "l": "Setup / effort / notes / Side-step / cue response / row 7", "ty": "text"}, {"k": "f", "id": "p49_table_296", "l": "First result / Trunk-support hold / row 8", "ty": "text"}, {"k": "f", "id": "p49_table_297", "l": "Later result / Trunk-support hold / row 8", "ty": "text"}, {"k": "f", "id": "p49_table_298", "l": "Setup / effort / notes / Trunk-support hold / row 8", "ty": "text"}, {"k": "h", "t": "MY NEXT STEP"}, {"k": "f", "id": "p49_inline_299", "l": "The everyday goal this informs: __________", "ty": "text"}, {"k": "f", "id": "p49_inline_300", "l": "What changed in the result or experience? __________", "ty": "text"}, {"k": "f", "id": "p49_inline_301", "l": "Repeat, adapt, pause or seek advice? __________", "ty": "text"}, {"k": "f", "id": "p49_inline_302", "l": "My next step / when / support: __________", "ty": "text"}, {"k": "t", "t": "Compare the same method, setup and support. A new version starts a separate record; an easier-feeling task can matter even when the number stays the same."}]}, {"number": 50, "title": "Mobility & comfort", "items": [{"k": "f", "id": "p50_chapter_focus_303", "l": "What everyday movement would I like to understand?", "ty": "text"}, {"k": "t", "t": "These checks describe movement and comfort. They cannot tell you why something hurts or diagnose a joint, nerve or muscle problem. Body proportions, chair height and technique affect what you see."}, {"k": "t", "t": "Use a stable seat or fixed support, move slowly and breathe normally. Stay within a comfortable range. Do not bounce, force, pull on your head or use someone else to push you farther. Read the specific instructions and stop for pain, dizziness or new symptoms."}, {"k": "t", "t": "One practice. two observations. For the simple movement checks, try one gentle practice then observe twice, unless the page gives a different method. Record the side and version. There is no need to repeat until you get a “better” result."}, {"k": "f", "id": "p50_reflection_304", "l": "The movement I choose and the ordinary task it connects with:", "ty": "text"}, {"k": "t", "t": "Follow clinical advice after injury or surgery. New weakness, major loss of movement or neurological symptoms need assessment; new bladder/bowel disturbance with back pain or saddle numbness needs urgent help. Choose support rather than using this book to investigate symptoms alone."}]}, {"number": 51, "title": "My body map", "items": [{"k": "t", "t": "Mark an area where you notice pain, tension or discomfort. Add a number if you want to connect more than one mark with your notes."}, {"k": "t", "t": "R and L mean your right and left. Mark on paper or use your PDF app’s drawing tool."}, {"k": "t", "t": "FRONT"}, {"k": "t", "t": "BACK"}, {"k": "c", "c": ["R", "L"]}, {"k": "c", "c": ["L", "R"]}, {"k": "c", "c": ["Date / time", "Location / mark number", "Severity · /10"]}, {"k": "f", "id": "map_date", "l": "map date", "ty": "text"}, {"k": "f", "id": "map_location", "l": "map location", "ty": "text"}, {"k": "f", "id": "map_severity", "l": "map severity", "ty": "text"}, {"k": "t", "t": "0 = no discomfort; 10 = worst imaginable. Describe your own experience."}, {"k": "c", "c": ["When does it occur?", "What has changed since last time?"]}, {"k": "f", "id": "map_when", "l": "map when", "ty": "text"}, {"k": "f", "id": "map_change", "l": "map change", "ty": "text"}, {"k": "c", "c": ["What seems to ease it?", "What seems to aggravate it?"]}, {"k": "f", "id": "map_better", "l": "map better", "ty": "text"}, {"k": "f", "id": "map_worse", "l": "map worse", "ty": "text"}, {"k": "t", "t": "This map records an experience, not its cause. Do not provoke symptoms to fill it in. New, severe or persistent symptoms deserve appropriate assessment; see the guidance on Mobility & comfort · p. 50."}]}, {"number": 52, "title": "Neck turns", "items": [{"k": "t", "t": "Sit or stand securely, head facing forward and shoulders relaxed. Keep the chin level. Slowly turn to look over one shoulder as far as is comfortable, return to centre, then try the other side. Keep shoulders facing forward and do not pull your head with your hands."}, {"k": "t", "t": "Make one gentle practice and two observations to each side. Describe what you can comfortably see or how the movement feels. You do not need a degree measurement or a perfectly equal range."}, {"k": "t", "t": "Optional demonstration / Neck rotation movement youtu.be/UbHEH6t_OJQ"}, {"k": "c", "c": ["Side", "What I noticed today", "Later observation"]}, {"k": "f", "id": "p52_table_305", "l": "What I noticed today / Left / row 1", "ty": "text"}, {"k": "f", "id": "p52_table_306", "l": "Later observation / Left / row 1", "ty": "text"}, {"k": "t", "t": "Left"}, {"k": "f", "id": "p52_table_307", "l": "What I noticed today / Right / row 2", "ty": "text"}, {"k": "f", "id": "p52_table_308", "l": "Later observation / Right / row 2", "ty": "text"}, {"k": "t", "t": "Right"}, {"k": "f", "id": "p52_reflection_309", "l": "When is looking around relevant in my day?", "ty": "text"}, {"k": "f", "id": "p52_reflection_310", "l": "What would I like to ask a clinician if this remains uncomfortable?", "ty": "text"}, {"k": "t", "t": "Stop for pain, dizziness, visual changes, tingling or other new symptoms and seek appropriate advice. Do not repeatedly provoke symptoms to describe them. General neck advice: NHS inform."}]}, {"number": 53, "title": "Shoulder reach", "items": [{"k": "t", "t": "Sit or stand securely. With thumb pointing up, slowly raise one arm forwards and upwards within a comfortable range, then lower. Let the shoulder blade move naturally; avoid leaning backwards to make the reach appear larger. Try each side separately."}, {"k": "t", "t": "Use one practice and two observations per side. Describe the highest comfortable position and the sensation. Do not force a painful arc or compare yourself with a picture of someone else."}, {"k": "h", "t": "Supported alternative"}, {"k": "t", "t": "Seated at a stable table, rest the forearm on it and slide the hand forwards within a comfortable range, allowing a gentle lean from the hips if suitable. Record this as a supported version, not the same test as lifting your arm."}, {"k": "t", "t": "Optional demonstration / Shoulder movement youtu.be/0u8IiwhIPT0"}, {"k": "c", "c": ["Date / setup", "Result / version", "Comfort / effort / context"]}, {"k": "f", "id": "p53_table_311", "l": "Date / setup / row 1", "ty": "text"}, {"k": "f", "id": "p53_table_312", "l": "Result / version / row 1", "ty": "text"}, {"k": "f", "id": "p53_table_313", "l": "Comfort / effort / context / row 1", "ty": "text"}, {"k": "f", "id": "p53_reflection_314", "l": "Left / right / version: where did the movement feel easy or limited?", "ty": "text"}, {"k": "f", "id": "p53_reflection_315", "l": "An everyday reach I would like to make more comfortably:", "ty": "text"}, {"k": "t", "t": "Keep the version the same next time. Persistent pain, new weakness or a sudden loss of movement deserves individual assessment."}]}, {"number": 54, "title": "Seated trunk turn", "items": [{"k": "t", "t": "Sit on a stable chair, feet supported and hips facing forwards. Cross your arms loosely or keep them comfortable. Slowly turn your chest to one side, letting your head follow, then return to centre. Try the other side. Keep the pelvis facing forwards rather than sliding around the seat."}, {"k": "t", "t": "Use one practice and two observations per side. Stay within comfort. Avoid using your hands on the chair to pull yourself further or holding your breath."}, {"k": "t", "t": "Optional demonstration / Seated trunk rotation youtu.be/JEDRfMbURRU"}, {"k": "c", "c": ["Side", "Comfort / movement today", "A later observation"]}, {"k": "f", "id": "p54_table_316", "l": "Comfort / movement today / Left / row 1", "ty": "text"}, {"k": "f", "id": "p54_table_317", "l": "A later observation / Left / row 1", "ty": "text"}, {"k": "t", "t": "Left"}, {"k": "f", "id": "p54_table_318", "l": "Comfort / movement today / Right / row 2", "ty": "text"}, {"k": "f", "id": "p54_table_319", "l": "A later observation / Right / row 2", "ty": "text"}, {"k": "t", "t": "Right"}, {"k": "f", "id": "p54_reflection_320", "l": "Where does this movement show up in my daily life?", "ty": "text"}, {"k": "f", "id": "p54_reflection_321", "l": "Was I observing, or trying to prove something? What would make the check gentler?", "ty": "text"}, {"k": "t", "t": "The observation cannot identify the source of back pain. If turning produces pain or neurological symptoms, stop and seek suitable advice."}]}, {"number": 55, "title": "Hip & knee movement", "items": [{"k": "h", "t": "Thigh lift"}, {"k": "t", "t": "Sit upright with feet supported. Lift one knee a little towards your chest, within a comfortable range, without leaning sharply backwards or pulling it with your hands. Lower slowly. Try each side: one practice, then two observations."}, {"k": "t", "t": "Optional demonstration / Seated thigh-lift movement youtu.be/1m72e65YZtM"}, {"k": "h", "t": "Knee bend and straighten"}, {"k": "t", "t": "While seated, slowly straighten one knee as far as comfortable, then bend it again, keeping the thigh supported. Do not lock or force the joint. Use one practice and two observations per side."}, {"k": "t", "t": "Optional demonstration / Seated knee movement youtu.be/HB0hHrXwImI"}, {"k": "c", "c": ["Movement", "Left: comfort / control", "Right: comfort / control"]}, {"k": "f", "id": "p55_table_322", "l": "Left: comfort / control / Thigh lift / row 1", "ty": "text"}, {"k": "f", "id": "p55_table_323", "l": "Right: comfort / control / Thigh lift / row 1", "ty": "text"}, {"k": "f", "id": "p55_table_324", "l": "Left: comfort / control / Knee bend / straighten / row 2", "ty": "text"}, {"k": "f", "id": "p55_table_325", "l": "Right: comfort / control / Knee bend / straighten / row 2", "ty": "text"}, {"k": "f", "id": "p55_reflection_326", "l": "Which everyday task connects with what I noticed?", "ty": "text"}, {"k": "t", "t": "A smaller range can reflect many things; do not infer a diagnosis. Follow any limits given after joint surgery or injury."}]}, {"number": 56, "title": "Chair sit-and-reach", "items": [{"k": "t", "t": "Use a firm chair against a wall and a ruler; a helper can measure. Sit securely near the front without risking sliding off. Keep one foot flat; extend the other leg with heel down and toes pointing up. Line up your middle fingertips, stack your hands and hinge gently forwards from the hips towards that foot. Stop at a comfortable stretch, without bouncing."}, {"k": "t", "t": "Use two gentle practices, then two measured attempts per side. Hold the comfortable end position about 2 seconds. Measure fingertips relative to the toe: short = minus, at the toe = 0, beyond = plus. Record the best comfortable attempt, chair height and side."}, {"k": "t", "t": "Optional demonstration / Chair sit-and-reach movement youtu.be/JYcO4vC3E_4"}, {"k": "c", "c": ["Side / date", "Attempt 1 / cm", "Attempt 2 / cm", "Best comfortable"]}, {"k": "f", "id": "p56_table_327", "l": "Attempt 1 / cm / Left / row 1", "ty": "text"}, {"k": "f", "id": "p56_table_328", "l": "Attempt 2 / cm / Left / row 1", "ty": "text"}, {"k": "f", "id": "p56_table_329", "l": "Best comfortable / Left / row 1", "ty": "text"}, {"k": "t", "t": "Left"}, {"k": "f", "id": "p56_date_330", "l": "Left observation date", "ty": "text"}, {"k": "f", "id": "p56_table_331", "l": "Attempt 1 / cm / Right / row 2", "ty": "text"}, {"k": "f", "id": "p56_table_332", "l": "Attempt 2 / cm / Right / row 2", "ty": "text"}, {"k": "f", "id": "p56_table_333", "l": "Best comfortable / Right / row 2", "ty": "text"}, {"k": "t", "t": "Right"}, {"k": "f", "id": "p56_date_334", "l": "Right observation date", "ty": "text"}, {"k": "t", "t": "Example: -6 cm to -2 cm means reaching 4 cm farther on this task. It does not prove that a muscle became 4 cm longer. Arm, leg and trunk proportions and chair height affect the result."}, {"k": "f", "id": "p56_inline_335", "l": "Chair height ______. What did I feel, and where?", "ty": "text"}, {"k": "t", "t": "If extending the leg or leaning forwards is unsuitable, leave this out and use the knee observation instead. Do not force stretching through pain, tingling or numbness. Source: Jones and colleagues (1998)."}]}, {"number": 57, "title": "Knee-to-wall", "items": [{"k": "t", "t": "Face a wall with a fixed support available. Place one foot pointing forwards. Bend the knee towards the wall over the middle toes, keeping the heel and whole foot on the floor. Move the foot back only as far as the knee can comfortably touch the wall without lifting the heel or twisting the foot."}, {"k": "t", "t": "After a practice, make three comfortable measurements on each side. Measure the distance from the big toe to the wall. Record the best comfortable distance, side, footwear and support. A helper can make measuring easier."}, {"k": "t", "t": "Optional demonstration / Knee-to-wall movement youtu.be/kbzYML05Vac"}, {"k": "c", "c": ["Side / date", "1 / cm", "2 / cm", "3 / cm", "Best"]}, {"k": "f", "id": "p57_table_337", "l": "1 / cm / Left / row 1", "ty": "text"}, {"k": "f", "id": "p57_table_338", "l": "2 / cm / Left / row 1", "ty": "text"}, {"k": "f", "id": "p57_table_339", "l": "3 / cm / Left / row 1", "ty": "text"}, {"k": "f", "id": "p57_table_340", "l": "Best / Left / row 1", "ty": "text"}, {"k": "t", "t": "Left"}, {"k": "f", "id": "p57_date_341", "l": "Left observation date", "ty": "text"}, {"k": "f", "id": "p57_table_342", "l": "1 / cm / Right / row 2", "ty": "text"}, {"k": "f", "id": "p57_table_343", "l": "2 / cm / Right / row 2", "ty": "text"}, {"k": "f", "id": "p57_table_344", "l": "3 / cm / Right / row 2", "ty": "text"}, {"k": "f", "id": "p57_table_345", "l": "Best / Right / row 2", "ty": "text"}, {"k": "t", "t": "Right"}, {"k": "f", "id": "p57_date_346", "l": "Right observation date", "ty": "text"}, {"k": "f", "id": "p57_reflection_347", "l": "Footwear / support / comfort / anything that changed the setup:", "ty": "text"}, {"k": "t", "t": "Seated alternative: keep the heel down and lift the front of the foot. Note ease and control, not a knee-to-wall distance."}, {"k": "t", "t": "Research suggests a change around 2 cm can exceed measurement error in some clinical settings. That is not a universal “normal” range or proof that a home measurement has changed meaningfully."}, {"k": "t", "t": "Do not push through ankle pain or move to an unstable surface. This task observes weight-bearing ankle movement; it does not diagnose its limits. Source: Powden, Hoch & Hoch (2015)."}]}, {"number": 58, "title": "Elbows, wrists & hands", "items": [{"k": "c", "c": ["Observe gently", "How to try it"]}, {"k": "c", "c": ["Elbow", "Bend and straighten within comfort. With elbow near your side, turn the palm up and down without forcing."]}, {"k": "c", "c": ["Wrist", "Support the forearm. Move the hand up and down slowly within comfort; keep the movement at the wrist."]}, {"k": "c", "c": ["Hand + thumb", "Open and close the hand comfortably. Touch the thumb to each fingertip if suitable; avoid squeezing hard."]}, {"k": "t", "t": "Use one practice and two observations per movement and side. Notice comfort, control and any relevant difference. Leave out movements limited by recent injury, surgery or clinical advice."}, {"k": "t", "t": "Optional demonstration / Elbow movement youtu.be/LDwUepsdA04"}, {"k": "t", "t": "Optional demonstration / Wrist movement youtu.be/dtwfwjMKWz4"}, {"k": "t", "t": "Optional demonstration / Thumb / finger movement youtu.be/9bb6cLmKf1U"}, {"k": "f", "id": "p58_reflection_348", "l": "What I noticed on the left and right:", "ty": "text"}, {"k": "f", "id": "p58_reflection_349", "l": "An everyday task — dressing, carrying, writing or another — that matters to me:", "ty": "text"}, {"k": "t", "t": "Pain, numbness or new loss of strength needs appropriate advice. Comparing sides is an observation, not a diagnosis."}]}, {"number": 59, "title": "Feet & ankles", "items": [{"k": "t", "t": "Sit securely with both feet supported. Gently lift the heels while keeping the front of the feet down, then lower. Next, keep heels down and lift the front of the feet and toes within comfort, then lower. Use one practice and two observations, without pushing for height."}, {"k": "t", "t": "Optional demonstration / Seated foot movement youtu.be/JegXz_XPgwk"}, {"k": "c", "c": ["Movement", "Left: comfort / control", "Right: comfort / control"]}, {"k": "f", "id": "p59_table_350", "l": "Left: comfort / control / Heel lift / row 1", "ty": "text"}, {"k": "f", "id": "p59_table_351", "l": "Right: comfort / control / Heel lift / row 1", "ty": "text"}, {"k": "f", "id": "p59_table_352", "l": "Left: comfort / control / Toe / forefoot lift / row 2", "ty": "text"}, {"k": "f", "id": "p59_table_353", "l": "Right: comfort / control / Toe / forefoot lift / row 2", "ty": "text"}, {"k": "f", "id": "p59_reflection_354", "l": "Footwear / seat / support used:", "ty": "text"}, {"k": "f", "id": "p59_reflection_355", "l": "What does this tell me about the movement itself? What remains unknown?", "ty": "text"}, {"k": "h", "t": "What would a great leader do?"}, {"k": "t", "t": "Would they value a careful observation more than a bigger number? How could I apply that here?"}, {"k": "t", "t": "This is separate from the standing calf-raise check. Persistent pain, numbness, swelling or a new movement difficulty deserves clinical advice."}]}, {"number": 60, "title": "My movement comparison", "items": [{"k": "c", "c": ["Movement / version", "First: L / R", "Later: L / R", "Setup / comfort"]}, {"k": "f", "id": "p60_table_356", "l": "First: L / R / Neck turns / row 1", "ty": "text"}, {"k": "f", "id": "p60_table_357", "l": "Later: L / R / Neck turns / row 1", "ty": "text"}, {"k": "f", "id": "p60_table_358", "l": "Setup / comfort / Neck turns / row 1", "ty": "text"}, {"k": "f", "id": "p60_table_359", "l": "First: L / R / Shoulder reach / table slide / row 2", "ty": "text"}, {"k": "f", "id": "p60_table_360", "l": "Later: L / R / Shoulder reach / table slide / row 2", "ty": "text"}, {"k": "f", "id": "p60_table_361", "l": "Setup / comfort / Shoulder reach / table slide / row 2", "ty": "text"}, {"k": "f", "id": "p60_table_362", "l": "First: L / R / Trunk turns / row 3", "ty": "text"}, {"k": "f", "id": "p60_table_363", "l": "Later: L / R / Trunk turns / row 3 // Well Mind — data layer.
// Everyday Wellbeing data stays in the original store (wellmind.everyday.v1) in the original
// record format, so existing clients keep everything and the older app could still read it.
// Understanding Yourself data lives in wellmind.understanding.v1.
// =====================================================================
const EKEY = 'wellmind.everyday.v1';
const UKEY = 'wellmind.understanding.v1';
let canSave = true, eLocked = false;

const pad = (n) => String(n).padStart(2, '0');
const isoOf = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => isoOf(new Date());
const parseDate = (s) => new Date(`${s}T12:00:00`);
const shift = (s, n) => { const d = parseDate(s); d.setDate(d.getDate() + n); return isoOf(d); };
const monday = (s = today()) => shift(s, -((parseDate(s).getDay() + 6) % 7));
const dateOk = (s) => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && shift(s, 0) === s;
const pretty = (s, o = { weekday: 'short', day: 'numeric', month: 'short' }) => parseDate(s).toLocaleDateString('en-IE', o);
const daysBetween = (a, b) => Math.round((parseDate(b) - parseDate(a)) / 864e5);
const num = (v) => (v === undefined || v === null || v === '' || !Number.isFinite(Number(v)) ? null : Number(v));
const fmt = (n, d = 0) => (n === null || n === undefined ? '—' : Number(n).toLocaleString('en-IE', { maximumFractionDigits: d }));

// ---------------- Everyday store ----------------
let E = { version: 1, entries: {} };
(function loadE() {
  let raw = null;
  try { raw = localStorage.getItem(EKEY); } catch (e) { canSave = false; return; }
  if (!raw) return;
  try {
    const d = JSON.parse(raw);
    if (d && typeof d === 'object' && d.entries && typeof d.entries === 'object' && !Array.isArray(d.entries)) E = { version: 1, ...d };
    else eLocked = true;
  } catch (e) { eLocked = true; }
})();
let eTimer = null, eDirty = false;
function saveE(now) {
  if (eLocked) return;
  eDirty = true;
  clearTimeout(eTimer);
  if (now) flushE(); else eTimer = setTimeout(flushE, 250);
}
function flushE() { if (!eDirty || eLocked) return; try { localStorage.setItem(EKEY, JSON.stringify(E)); canSave = true; eDirty = false; } catch (e) { canSave = false; } }
const entries = () => Object.values(E.entries);
const KEY_OK = /^[A-Za-z][\w-]{0,100}$/;
function upsert(kind, date, title, mutate) {
  const id = `${kind}:${date}`;
  const rec = E.entries[id] ? { ...E.entries[id], fields: { ...E.entries[id].fields } } : { id, kind, date, title, fields: {} };
  mutate(rec.fields);
  for (const k of Object.keys(rec.fields)) if (!KEY_OK.test(k) || typeof rec.fields[k] !== 'string') delete rec.fields[k];
  const meaningful = Object.entries(rec.fields).some(([k, v]) => !['trackingBasis', 'status'].includes(k) && v !== '' && v !== 'false' && v !== '[]');
  if (meaningful) { rec.updatedAt = new Date().toISOString(); E.entries[id] = rec; }
  else delete E.entries[id];
  markActive();
  saveE();
  return rec;
}

    const raw = localStorage.getItem(UKEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    if (d && d.v === 1 && typeof d.answers === 'object') {

const URL_RE = /((?:https?:\/\/)?(?:[a-z0-9-]+\.)+[a-z]{2,}(?:\/[^\s]*)?)\s*$/i;
function cleanLabel(item, heads = []) {
  if (EW_LABELS[item.id]) return EW_LABELS[item.id];
  const cap = (t) => t.charAt(0).toUpperCase() + t.slice(1);
  const low = (h) => (/^[A-Z][a-z]|^[A-Z] [a-z]/.test(h) ? h.charAt(0).toLowerCase() + h.slice(1) : h);
  const l = item.l.replace(/_{2,}/g, '…').replace(/…\.+/g, '…').replace(/\s+/g, ' ').trim();
  const m = l.match(/^(.*) \/ row (\d+)$/);
  if (!m) return cap(l);
  const [, body, row] = m;
  for (const h of [...heads].sort((a, b) => b.length - a.length)) {
    if (body.startsWith(h + ' / ') && body.length > h.length + 3) return `${cap(body.slice(h.length + 3).replace(/:\s*$/, ''))} — ${low(h)}`;
  }
  return heads.includes(body) || !body.includes(' / ') ? `${cap(body)} · ${row}` : cap(body);
}
function pageCard(ch, n, back) {
  const p = EW_PAGES.find((x) => x.number === n);
  if (!p) return `<article class="cardx ${back}"><h2>Page ${n}</h2></article>`;
  const extra = EW_EXTRA[n] || {};
  let html = '', table = null, checks = [];
  const flushTable = () => { if (table) { html += `<div style="overflow-x:auto"><table class="tbl"><thead><tr>${table.head.map((h) => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${table.rows.map((r) => `<tr>${r.map((c) => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`; table = null; } };
  const flushChecks = () => { if (checks.length) { html += `<div class="ptoggles">${checks.join('')}</div>`; checks = []; } };
  let leaderNext = false, skipWheelText = n === 34;
  const heads = [];
  for (const it of p.items) {
    if (it.k !== 'c') flushTable();
    if (!(it.k === 'f' && it.ty === 'checkbox')) flushChecks();
    if (it.k === 'h') {
      if (/what would a great leader do/i.test(it.t)) { html += `<div class="leader-mini"><span aria-hidden="true">♛</span> What would a great leader do?</div>`; leaderNext = true; continue; }
      if (/^my next step$/i.test(it.t)) { html += `<div class="eyebrow" style="margin-top:22px">My next step</div>`; continue; }
      html += `<h3 class="ph">${esc(it.t)}</h3>`;
    } else if (it.k === 't') {
      if (skipWheelText && /^(\d+|Rest & energy|Meaning & self|Food & body care|Play & creativity|Movement|Home & support|Relationships|Work & money)$/.test(it.t.trim())) continue;
      const m = it.t.match(URL_RE);
      if (m && m[1].includes('/') && it.t.length > m[1].length + 8) { const head = it.t.slice(0, it.t.length - m[0].length).trim(); const sp = head.split(/(?<=[a-z\)])\s(?=[A-Z])/); html += resourceHtml([sp[0], m[1], sp.slice(1).join(' ')]); }
